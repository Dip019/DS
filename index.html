<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>তোমার জন্য... ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --pink:#ff4f8b;
    --pink2:#ff8fb4;
    --rose:#ff2f70;
    --purple:#9b6cff;
    --dark:#080510;
    --white:#fff;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#080510;
    color:white;
    font-family:"Noto Serif Bengali",serif;
}

/* =========================================================
   MAIN BACKGROUND
========================================================= */

#universe{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 40%,rgba(122,42,100,.22),transparent 35%),
        radial-gradient(circle at 15% 80%,rgba(90,50,160,.20),transparent 35%),
        radial-gradient(circle at 90% 20%,rgba(255,50,120,.12),transparent 30%),
        linear-gradient(145deg,#05030a,#110718 50%,#07040d);
}

#stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    opacity:.5;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.15;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1.6);
    }
}

/* =========================================================
   GLOWING ORBS
========================================================= */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.25;
    animation:orbFloat 14s ease-in-out infinite alternate;
}

.orb1{
    width:350px;
    height:350px;
    background:#ff2d70;
    top:-180px;
    left:-100px;
}

.orb2{
    width:400px;
    height:400px;
    background:#733cff;
    right:-200px;
    bottom:-200px;
    animation-delay:3s;
}

.orb3{
    width:220px;
    height:220px;
    background:#ff80bd;
    left:45%;
    top:50%;
    opacity:.12;
    animation-delay:6s;
}

@keyframes orbFloat{
    0%{
        transform:translate(0,0) scale(1);
    }
    100%{
        transform:translate(70px,50px) scale(1.15);
    }
}

/* =========================================================
   MOON
========================================================= */

.moon{
    position:absolute;
    width:130px;
    height:130px;
    border-radius:50%;
    right:10%;
    top:9%;
    background:
        radial-gradient(circle at 35% 35%,#fff,#ffeaf2 55%,#ffcbdc);
    box-shadow:
        0 0 30px rgba(255,210,225,.35),
        0 0 100px rgba(255,150,190,.15);
    animation:moonFloat 5s ease-in-out infinite;
}

.moon:after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:#09050e;
    left:-35px;
    top:-10px;
}

@keyframes moonFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(12px);
    }
}

/* =========================================================
   FLOATING PETALS
========================================================= */

#petals{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:3;
}

.petal{
    position:absolute;
    top:-30px;
    font-size:16px;
    opacity:.7;
    animation:petalFall linear forwards;
}

@keyframes petalFall{
    0%{
        transform:translateY(-30px) rotate(0deg);
        opacity:0;
    }
    10%{
        opacity:.8;
    }
    90%{
        opacity:.5;
    }
    100%{
        transform:translateY(110vh) rotate(540deg);
        opacity:0;
    }
}

/* =========================================================
   APP
========================================================= */

#app{
    position:relative;
    z-index:5;
    width:100%;
    height:100vh;
}

.scene{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    animation:sceneIn 1s ease;
}

@keyframes sceneIn{
    from{
        opacity:0;
        transform:scale(1.04);
        filter:blur(10px);
    }
    to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

/* =========================================================
   GLASS CARD
========================================================= */

.card{
    width:min(900px,100%);
    max-height:92vh;
    overflow:auto;
    padding:55px 50px;
    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.12);

    border-radius:36px;

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.08);

    scrollbar-width:none;
}

.card::-webkit-scrollbar{
    display:none;
}

/* =========================================================
   TYPOGRAPHY
========================================================= */

.small{
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#ff9dbd;
    margin-bottom:18px;
}

.script{
    font-family:"Tiro Bangla",serif;
    font-style:italic;
    color:#ff9fbe;
}

h1{
    font-size:clamp(42px,8vw,82px);
    line-height:1.2;
    font-weight:600;
}

h2{
    font-size:clamp(30px,5vw,52px);
    line-height:1.3;
    margin-bottom:20px;
}

p{
    font-size:17px;
    line-height:2;
    color:rgba(255,255,255,.72);
}

/* =========================================================
   GLOWING HEART
========================================================= */

.main-heart{
    position:relative;
    width:150px;
    height:150px;
    margin:0 auto 30px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:75px;

    animation:heartBeat 1.5s infinite;

    filter:drop-shadow(0 0 25px rgba(255,50,110,.8));
}

.main-heart:before,
.main-heart:after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid rgba(255,100,150,.2);
    animation:ring 2.5s infinite;
}

.main-heart:after{
    animation-delay:.8s;
}

@keyframes heartBeat{
    0%,100%{
        transform:scale(1);
    }
    15%{
        transform:scale(1.12);
    }
    30%{
        transform:scale(1);
    }
    45%{
        transform:scale(1.08);
    }
}

@keyframes ring{
    0%{
        transform:scale(.7);
        opacity:.8;
    }
    100%{
        transform:scale(1.7);
        opacity:0;
    }
}

/* =========================================================
   BUTTON
========================================================= */

.btn{
    position:relative;
    border:0;
    outline:0;
    cursor:pointer;

    margin-top:30px;

    padding:16px 35px;

    border-radius:100px;

    color:white;
    font-family:inherit;
    font-size:16px;
    font-weight:600;

    background:
        linear-gradient(135deg,#ff3e79,#ff78a5);

    box-shadow:
        0 12px 35px rgba(255,45,105,.25),
        inset 0 1px 0 rgba(255,255,255,.3);

    transition:.35s ease;
}

.btn:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:
        0 18px 45px rgba(255,45,105,.4),
        0 0 25px rgba(255,80,140,.2);
}

.btn:active{
    transform:scale(.96);
}

.btn.secondary{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:none;
}

/* =========================================================
   CHAPTER INDICATOR
========================================================= */

.chapter{
    display:inline-flex;
    align-items:center;
    gap:10px;

    padding:8px 16px;
    border-radius:50px;

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);

    color:#ffabc5;
    font-size:13px;

    margin-bottom:25px;
}

.chapter-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ff5c91;
    box-shadow:0 0 10px #ff5c91;
}

/* =========================================================
   LEVEL 1 — ENVELOPE
========================================================= */

.envelope-wrap{
    width:220px;
    height:155px;
    margin:30px auto;
    position:relative;
    cursor:pointer;
    perspective:800px;
}

.envelope{
    width:100%;
    height:100%;
    position:relative;
    background:#d93467;
    border-radius:8px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.envelope:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    border-left:110px solid transparent;
    border-right:110px solid transparent;
    border-top:90px solid #f35c89;
    transform-origin:top;
    transition:1s;
    z-index:3;
}

.envelope.open:before{
    transform:rotateX(180deg);
}

.letter{
    position:absolute;
    left:10%;
    bottom:10px;
    width:80%;
    height:80%;
    background:#fff6f9;
    color:#9b3054;
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    transition:1s;
    z-index:2;
}

.envelope.open .letter{
    transform:translateY(-90px);
}

/* =========================================================
   LEVEL 2 — CONSTELLATION
========================================================= */

.sky{
    position:relative;
    height:380px;
    margin:25px auto;
    max-width:750px;
    border-radius:28px;
    overflow:hidden;

    background:
        radial-gradient(circle at center,rgba(87,50,150,.25),transparent 55%),
        rgba(0,0,0,.25);

    border:1px solid rgba(255,255,255,.08);
}

.constellation-star{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 15px 5px rgba(255,170,210,.8);
    cursor:pointer;
    transition:.3s;
}

.constellation-star:hover{
    transform:scale(1.7);
}

.constellation-star.active{
    background:#ff82ac;
}

#lines{
    position:absolute;
    inset:0;
    pointer-events:none;
}

#lines line{
    stroke:rgba(255,120,170,.7);
    stroke-width:1;
    stroke-dasharray:5 5;
    animation:lineGlow 2s infinite alternate;
}

@keyframes lineGlow{
    from{opacity:.2;}
    to{opacity:1;}
}

/* =========================================================
   LEVEL 3 — MEMORY WORDS
========================================================= */

.memory-container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    max-width:650px;
    margin:35px auto;
}

.memory-tile{
    height:120px;
    border-radius:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,90,140,.10),
            rgba(140,90,255,.08)
        );

    border:1px solid rgba(255,255,255,.10);

    font-size:30px;

    transition:.4s;
}

.memory-tile:hover{
    transform:translateY(-5px);
    border-color:rgba(255,100,160,.4);
}

.memory-tile.revealed{
    background:rgba(255,255,255,.1);
    transform:rotateY(360deg);
}

.memory-word{
    font-size:17px;
    color:#ffb0c8;
}

/* =========================================================
   LEVEL 4 — HEART CHOICES
========================================================= */

.choice-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
    max-width:700px;
    margin:35px auto;
}

.choice{
    position:relative;
    padding:30px 20px;
    border-radius:24px;
    cursor:pointer;

    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);

    transition:.35s;
    overflow:hidden;
}

.choice:before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at center,rgba(255,70,130,.15),transparent 65%);
    opacity:0;
    transition:.35s;
}

.choice:hover{
    transform:translateY(-7px);
    border-color:rgba(255,100,160,.5);
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.choice:hover:before{
    opacity:1;
}

.choice-icon{
    position:relative;
    font-size:45px;
    margin-bottom:12px;
}

.choice strong{
    position:relative;
    font-size:20px;
}

.choice p{
    position:relative;
    font-size:14px;
    margin-top:5px;
}

/* =========================================================
   LEVEL 5
========================================================= */

.final-question{
    max-width:700px;
    margin:auto;
}

.final-question .heart-line{
    font-size:35px;
    letter-spacing:8px;
    margin:25px 0;
    animation:softPulse 2s infinite;
}

@keyframes softPulse{
    0%,100%{opacity:.5;}
    50%{opacity:1;}
}

/* =========================================================
   FINAL SCREEN
========================================================= */

.final-scene{
    position:fixed;
    inset:0;
    z-index:50;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(circle at center,rgba(255,40,110,.16),transparent 45%),
        #07030b;

    animation:finalIn 2s ease;
}

@keyframes finalIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

.final-content{
    width:min(850px,100%);
    text-align:center;
    max-height:92vh;
    overflow:auto;
    scrollbar-width:none;
}

.final-content::-webkit-scrollbar{
    display:none;
}

.final-symbol{
    font-size:80px;
    animation:heartBeat 1.4s infinite;
    filter:drop-shadow(0 0 30px rgba(255,60,120,.8));
}

.final-title{
    margin-top:20px;
    font-size:clamp(42px,8vw,85px);
}

.final-subtitle{
    color:#ff9fbd;
    font-size:20px;
    margin:15px 0 30px;
}

.letter-final{
    text-align:left;

    padding:35px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.03)
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 30px 100px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.07);
}

.letter-final p{
    font-size:18px;
    line-height:2.1;
    margin-bottom:15px;
}

.signature{
    margin-top:30px;
    font-family:"Tiro Bangla",serif;
    font-size:25px;
    color:#ff9dbb;
    text-align:right;
}

/* =========================================================
   TYPEWRITER
========================================================= */

.typewriter{
    min-height:70px;
}

/* =========================================================
   PARTICLE BURST
========================================================= */

.burst{
    position:fixed;
    pointer-events:none;
    z-index:100;
    font-size:20px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

    .scene{
        padding:14px;
    }

    .card{
        padding:35px 20px;
        border-radius:28px;
        max-height:94vh;
    }

    .moon{
        width:75px;
        height:75px;
        right:7%;
        top:5%;
    }

    .moon:after{
        width:70px;
        height:70px;
        left:-20px;
        top:-6px;
    }

    p{
        font-size:15px;
    }

    .main-heart{
        transform:scale(.8);
        margin-top:-10px;
    }

    .memory-container{
        grid-template-columns:repeat(2,1fr);
    }

    .memory-tile{
        height:100px;
    }

    .choice-grid{
        grid-template-columns:1fr;
    }

    .sky{
        height:330px;
    }

    .letter-final{
        padding:22px;
    }

    .letter-final p{
        font-size:15px;
        line-height:1.9;
    }

    .signature{
        font-size:20px;
    }
}

</style>
</head>


<body>

<!-- ======================================================
     BACKGROUND
====================================================== -->

<div id="universe">

    <div id="stars"></div>

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <div class="moon"></div>

</div>

<div id="petals"></div>

<div id="app"></div>


<script>

/* =========================================================
   ❤️ PERSONALIZATION
========================================================= */

/*
    এখান থেকে নাম পরিবর্তন করো।
*/

const YOUR_NAME = "তোমার মানুষ";
const HER_NAME = "আমার প্রিয়";



/*
    শেষের Love Letter এখান থেকে পরিবর্তন করতে পারো।
*/

const LOVE_LETTER = [

`তুমি জানো কি, এই পুরো ছোট্ট game-টা আসলে কোনো game ছিল না।`,

`আমি শুধু একটা অজুহাত চেয়েছিলাম তোমাকে কয়েকটা মুহূর্তের জন্য আমার পৃথিবীর মধ্যে নিয়ে আসার।`,

`কারণ তোমাকে নিয়ে আমার বলার মতো অনেক কথা আছে, কিন্তু সব কথা মুখে বলা যায় না।`,

`তুমি আমার জীবনের সেই মানুষ, যার সাথে কথা বললে সময় কেমন করে যেন একটু দ্রুত চলে যায়। আর তোমাকে না দেখলে একটা সাধারণ দিনও কেমন যেন একটু অসম্পূর্ণ লাগে।`,

`তোমার হাসি, তোমার অভিমান, তোমার ছোট ছোট পাগলামি—সবকিছু মিলিয়েই তুমি। আর সত্যি বলতে, আমি এই "তুমি"-টাকেই খুব ভালোবাসি।`,

`জীবনে সবকিছু সবসময় perfect হবে না। হয়তো আমাদের মাঝে কখনো অভিমান হবে, মন খারাপ হবে, ভুল বোঝাবুঝিও হবে। কিন্তু একটা জিনিস যেন কখনো বদলে না যায়—আমরা যেন একে অপরকে বেছে নেওয়া বন্ধ না করি।`,

`কারণ আমি চাই, অনেক বছর পরেও কোনো এক শান্ত রাতে তোমার পাশে বসে মনে হোক—হ্যাঁ, এই মানুষটাকেই তো আমি চেয়েছিলাম।`,

`তুমি আমার কাছে শুধু "ভালোবাসার মানুষ" নও। তুমি আমার শান্তি, আমার হাসির কারণ, আমার প্রিয় notification, আর আমার অনেকগুলো ভবিষ্যৎ স্বপ্নের একটা বড় অংশ।`,

`তাই আজ শুধু একটা কথাই বলতে চাই...`,

`আমি জানি না ভবিষ্যৎ আমাদের কোথায় নিয়ে যাবে। কিন্তু যতদিন আমার হাতে choice থাকবে, আমি তোমাকেই বেছে নেব। বারবার। প্রতিবার। ❤️`

];



/* =========================================================
   GAME STATE
========================================================= */

let currentLevel = 0;


/* =========================================================
   CREATE STARS
========================================================= */

function createStars(){

    const container =
        document.getElementById("stars");

    for(let i=0;i<130;i++){

        const star =
            document.createElement("div");

        star.className="star";

        star.style.left =
            Math.random()*100+"%";

        star.style.top =
            Math.random()*100+"%";

        const size =
            Math.random()*2.5+.5;

        star.style.width=size+"px";
        star.style.height=size+"px";

        star.style.animationDelay =
            Math.random()*4+"s";

        container.appendChild(star);
    }
}


/* =========================================================
   PETALS
========================================================= */

function createPetal(){

    const p =
        document.createElement("div");

    p.className="petal";

    const symbols=["🌸","♡","✦","♥","❀"];

    p.innerText =

/* =========================================================
   BURST
========================================================= */

function burst(x,y){

    const symbols=["❤️","✨","💕","✦","💗"];

    for(let i=0;i<12;i++){

        const el=
            document.createElement("div");

        el.className="burst";

        el.innerText=
            symbols[
                Math.floor(
                    Math.random()*symbols.length
                )
            ];

        el.style.left=x+"px";
        el.style.top=y+"px";

        document.body.appendChild(el);

        const angle=
            Math.random()*Math.PI*2;

        const distance=
            50+Math.random()*100;

        const tx=
            Math.cos(angle)*distance;

        const ty=
            Math.sin(angle)*distance;

        el.animate(
            [
                {
                    transform:"translate(-50%,-50%) scale(.3)",
                    opacity:1
                },
                {
                    transform:
                        `translate(
                            calc(-50% + ${tx}px),
                            calc(-50% + ${ty}px)
                        ) scale(1.3)`,
                    opacity:0
                }
            ],
            {
                duration:800+Math.random()*500,
                easing:"ease-out"
            }
        );

        setTimeout(
            ()=>el.remove(),
            1400
        );
    }
}

function createConstellation(){

    const sky=
        document.getElementById("sky");

    starPositions.forEach((pos,index)=>{

            document.createElement("div");

        star.className=
            "constellation-star";

        star.style.left=
            pos[0]+"%";

        star.style.top=
            pos[1]+"%";

        star.dataset.index=index;

        star.onclick=()=>clickStar(star,index);

        sky.appendChild(star);
    });

function clickStar(star,index){

    if(clickedStars.includes(index))
        return;

    clickedStars.push(index);

    star.classList.add("active");

    if(clickedStars.length>1){

        const previousIndex=
            clickedStars[clickedStars.length-2];

        drawLine(
            previousIndex,
            index
        );

    }

    document.getElementById("starText").innerText=
        `১০টি তারার মধ্যে ${clickedStars.length}টি খুঁজে পেয়েছো`;

    burst(
        star.getBoundingClientRect().left,
        star.getBoundingClientRect().top
    );

    if(clickedStars.length===10){

        document.getElementById("starText").innerText=
            "দেখো... আমাদের নিজেদের একটা আকাশ তৈরি হয়ে গেছে। ❤️";

        createHeartConstellation();
    }
}


function drawLine(a,b){

    const svg=
        document.getElementById("lines");

    const x1=
        starPositions[a][0];

    const y1=
        starPositions[a][1];

    const x2=
        starPositions[b][0];

    const y2=
        starPositions[b][1];

    const line=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    line.setAttribute("x1",x1+"%");
    line.setAttribute("y1",y1+"%");

    line.setAttribute("x2",x2+"%");
    line.setAttribute("y2",y2+"%");

    svg.appendChild(line);
}

function createBigHeartExplosion(){

    const symbols=[
        "❤️",
        "💕",
        "💗",
        "💖",
        "💘",
        "✨",
        "🌸"
    ];

    for(let i=0;i<100;i++){

        const el=
            document.createElement("div");

        el.style.position="fixed";
        el.style.left="50%";
        el.style.top="50%";
        el.style.zIndex="1000";
        el.style.pointerEvents="none";

        el.innerText=
            symbols[
                Math.floor(
                    Math.random()*symbols.length
                )
            ];

        const angle=
            Math.random()*Math.PI*2;

        const distance=
            100+Math.random()*550;

        const x=
            Math.cos(angle)*distance;

        const y=
            Math.sin(angle)*distance;

        el.animate(
            [
                {
                    transform:
                        "translate(-50%,-50%) scale(.2)",
                    opacity:1
                },
                {
                    transform:
                        `translate(
                            calc(-50% + ${x}px),
                            calc(-50% + ${y}px)
                        ) rotate(${Math.random()*720}deg)
                        scale(${.6+Math.random()})`,
                    opacity:0
                }
            ],
            {
                duration:
                    1300+Math.random()*1500,
                easing:"cubic-bezier(.1,.8,.2,1)"
            }
        );

        document.body.appendChild(el);

        setTimeout(
            ()=>el.remove(),
            3000
        );
    }

    /* extra bursts */

    for(let i=0;i<80;i++){

        setTimeout(()=>{

            burst(
                Math.random()*window.innerWidth,
                Math.random()*window.innerHeight
            );

        },Math.random()*1800);

    }
}
