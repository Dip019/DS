<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Game For You ❤️</title>

<style>
/* =========================================================
   LOVE GAME — COMPLETE SINGLE FILE
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #ff4f81;
    --hot-pink: #ff2f68;
    --purple: #9b5de5;
    --deep: #160b22;
    --card: rgba(255,255,255,0.10);
    --border: rgba(255,255,255,0.18);
    --white: #ffffff;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "DM Sans", sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(255, 55, 120, .20), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(155, 93, 229, .20), transparent 35%),
        linear-gradient(135deg, #120818, #250b28 50%, #100817);
    color: white;
    overflow-x: hidden;
}

/* ================= BACKGROUND ================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .35;
    animation: floatOrb 12s ease-in-out infinite alternate;
}

.orb.one {
    width: 250px;
    height: 250px;
    background: #ff3675;
    left: -80px;
    top: 10%;
}

.orb.two {
    width: 300px;
    height: 300px;
    background: #8f4fff;
    right: -100px;
    bottom: 5%;
    animation-delay: 3s;
}

.orb.three {
    width: 180px;
    height: 180px;
    background: #ff9bce;
    left: 45%;
    top: -80px;
    animation-delay: 5s;
}

@keyframes floatOrb {
    from {
        transform: translate(0,0) scale(1);
    }
    to {
        transform: translate(40px,30px) scale(1.2);
    }
}

/* ================= FLOATING HEARTS ================= */

.bg-heart {
    position: fixed;
    bottom: -50px;
    color: rgba(255, 100, 150, .35);
    font-size: 18px;
    animation: riseHeart linear infinite;
    pointer-events: none;
    z-index: 1;
}

@keyframes riseHeart {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: .8;
    }

    90% {
        opacity: .6;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* ================= APP ================= */

#app {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.screen {
    width: 100%;
    max-width: 850px;
    min-height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 100%;
    padding: 45px;
    border-radius: 30px;
    background: rgba(255,255,255,.08);
    border: 1px solid var(--border);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow:
        0 30px 80px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.10);
    text-align: center;
    animation: cardIn .7s ease;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ================= START SCREEN ================= */

.big-heart {
    font-size: 90px;
    display: inline-block;
    filter: drop-shadow(0 0 25px rgba(255,60,110,.7));
    animation: heartbeat 1.4s infinite;
}

@keyframes heartbeat {
    0%,100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.18);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.12);
    }

    60% {
        transform: scale(1);
    }
}

.script {
    font-family: Pacifico, cursive;
    color: #ff9cbd;
}

h1 {
    font-size: clamp(38px, 7vw, 68px);
    line-height: 1.1;
    margin: 20px 0;
}

h2 {
    font-size: clamp(28px, 5vw, 45px);
    margin-bottom: 15px;
}

p {
    color: rgba(255,255,255,.78);
    line-height: 1.7;
    font-size: 16px;
}

.subtitle {
    max-width: 600px;
    margin: 0 auto 30px;
}

/* ================= BUTTON ================= */

.btn {
    border: none;
    outline: none;
    cursor: pointer;
    color: white;
    padding: 15px 30px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(135deg, #ff4f81, #ff2868);
    box-shadow:
        0 10px 30px rgba(255,47,104,.3),
        inset 0 1px 0 rgba(255,255,255,.25);
    transition: .25s ease;
    margin: 8px;
}

.btn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 15px 35px rgba(255,47,104,.45);
}

.btn:active {
    transform: scale(.96);
}

.btn.secondary {
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: none;
}

/* ================= PROGRESS ================= */

.progress-wrap {
    width: 100%;
    max-width: 650px;
    margin: 0 auto 35px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    color: rgba(255,255,255,.6);
    font-size: 13px;
    margin-bottom: 8px;
}

.progress {
    height: 7px;
    border-radius: 99px;
    background: rgba(255,255,255,.12);
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, #ff4f81, #ff9ec4, #a96bff);
    transition: width .5s ease;
}

/* ================= QUESTION ================= */

.question-number {
    color: #ff9cbd;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin: 30px 0;
}

.answer {
    padding: 18px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.13);
    background: rgba(255,255,255,.06);
    color: white;
    cursor: pointer;
    transition: .25s ease;
    font-size: 15px;
}

.answer:hover {
    transform: translateY(-3px);
    background: rgba(255,79,129,.15);
    border-color: rgba(255,100,150,.5);
}

.answer.correct {
    background: rgba(60,220,140,.20);
    border-color: rgba(80,255,160,.7);
}

.answer.wrong {
    background: rgba(255,50,80,.20);
    border-color: rgba(255,70,90,.7);
}

/* ================= CATCH HEART ================= */

.game-area {
    height: 330px;
    margin: 25px 0;
    border-radius: 25px;
    background:
        radial-gradient(circle at center, rgba(255,80,130,.08), transparent 50%),
        rgba(0,0,0,.12);
    border: 1px solid rgba(255,255,255,.10);
    position: relative;
    overflow: hidden;
}

.catch-heart {
    position: absolute;
    font-size: 35px;
    cursor: pointer;
    user-select: none;
    animation: heartPulse .7s infinite alternate;
    filter: drop-shadow(0 0 12px rgba(255,70,120,.8));
    transition: transform .15s;
}

.catch-heart:hover {
    transform: scale(1.25);
}

@keyframes heartPulse {
    from {
        transform: scale(.9);
    }

    to {
        transform: scale(1.15);
    }
}

.game-stats {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 15px;
}

.stat strong {
    display: block;
    font-size: 28px;
    color: #ff9cbd;
}

.stat span {
    font-size: 12px;
    color: rgba(255,255,255,.5);
}

/* ================= MEMORY GAME ================= */

.memory-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 500px;
    margin: 30px auto;
}

.memory-card {
    aspect-ratio: 1;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,.15);
    background: linear-gradient(135deg, rgba(255,79,129,.15), rgba(155,93,229,.12));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    transition: .3s;
}

.memory-card:hover {
    transform: scale(1.04);
}

.memory-card.flipped {
    background: rgba(255,255,255,.12);
    transform: rotateY(180deg);
}

.memory-card.matched {
    background: rgba(255,80,140,.25);
    border-color: rgba(255,120,170,.6);
}

/* ================= CHOICE ================= */

.choice-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin: 30px auto;
    max-width: 650px;
}

.choice {
    padding: 25px 15px;
    border-radius: 20px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    cursor: pointer;
    transition: .3s;
}

.choice:hover {
    transform: translateY(-5px);
    border-color: rgba(255,100,160,.6);
    background: rgba(255,70,130,.12);
}

.choice-icon {
    font-size: 38px;
    margin-bottom: 10px;
}

/* ================= FINAL ================= */

.final-screen {
    min-height: 100vh;
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.final-card {
    max-width: 780px;
    position: relative;
    padding: 55px;
}

.final-heart {
    font-size: 80px;
    animation: heartbeat 1.3s infinite;
}

.love-letter {
    margin-top: 25px;
    text-align: left;
    padding: 28px;
    border-radius: 22px;
    background: rgba(255,255,255,.06);
    border-left: 3px solid #ff5c91;
}

.love-letter p {
    font-size: 17px;
    margin-bottom: 14px;
}

.signature {
    font-family: Pacifico, cursive;
    color: #ff9fbe;
    font-size: 26px;
    margin-top: 20px;
}

/* ================= CONFETTI ================= */

.confetti {
    position: fixed;
    width: 9px;
    height: 14px;
    top: -20px;
    z-index: 999;
    pointer-events: none;
    animation: confettiFall linear forwards;
}

@keyframes confettiFall {
    to {
        transform:
            translateY(110vh)
            rotate(720deg);
        opacity: 0;
    }
}

/* ================= SPARKLES ================= */

.sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 20px;
    z-index: 998;
    animation: sparkleOut 1s ease forwards;
}

@keyframes sparkleOut {
    0% {
        opacity: 1;
        transform: scale(.5);
    }

    100% {
        opacity: 0;
        transform: scale(1.7) translateY(-30px);
    }
}

/* ================= SHAKE ================= */

.shake {
    animation: shake .4s ease;
}

@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

/* ================= MOBILE ================= */

@media(max-width: 650px) {

    #app {
        padding: 14px;
    }

    .screen {
        min-height: 90vh;
    }

    .card {
        padding: 28px 20px;
        border-radius: 24px;
    }

    .big-heart {
        font-size: 70px;
    }

    .answers,
    .choice-container {
        grid-template-columns: 1fr;
    }

    .memory-grid {
        gap: 8px;
    }

    .memory-card {
        font-size: 23px;
        border-radius: 11px;
    }

    .game-area {
        height: 280px;
    }

    .final-card {
        padding: 35px 22px;
    }

    .love-letter {
        padding: 20px;
    }

    .love-letter p {
        font-size: 15px;
    }
}

/* ================= HIDDEN ================= */

.hidden {
    display: none !important;
}

.fade {
    animation: cardIn .6s ease;
}
</style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>

<div id="floatingHearts"></div>

<div id="app"></div>


<script>

/* =========================================================
   ❤️ PERSONALIZE YOUR GAME HERE
   ========================================================= */

const YOU = "Your Name";
const HER = "My Love";

/*
   Change the final message here.
*/
const FINAL_MESSAGE = `
If you ever wonder how important you are to me,
just remember this little game.

Every level was created for one simple reason —
to remind you that somewhere in this huge world,
there is someone who feels incredibly lucky
to have you in his life.

You are not just someone I love.

You are the person who makes ordinary moments
feel special, boring days feel brighter,
and my world feel a little more beautiful.

I don't know what the future has planned for us,
but I know one thing...

If I get to choose,
I will keep choosing you.

Again.
And again.
And again. ❤️

Thank you for being you.

I love you more than these little words
could ever explain.
`;


/* =========================================================
   GAME STATE
   ========================================================= */

let level = 0;
let score = 0;

const app = document.getElementById("app");


/* =========================================================
   BACKGROUND HEARTS
   ========================================================= */

function createBackgroundHeart() {

    const heart = document.createElement("div");

    heart.className = "bg-heart";

    const hearts = ["❤️","💕","💗","💖","💘","💓","♥"];

    heart.innerText =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
        Math.random() * 100 + "%";

    heart.style.fontSize =
        (12 + Math.random() * 22) + "px";

    heart.style.animationDuration =
        (7 + Math.random() * 9) + "s";

    heart.style.animationDelay =
        Math.random() * 3 + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 18000);
}

setInterval(createBackgroundHeart, 600);


/* =========================================================
   SPARKLE EFFECT
   ========================================================= */

function sparkle(x, y) {

    const s = document.createElement("div");

    s.className = "sparkle";
    s.innerText = "✨";

    s.style.left = x + "px";
    s.style.top = y + "px";

    document.body.appendChild(s);

    setTimeout(() => s.remove(), 1000);
}


/* =========================================================
   CONFETTI
   ========================================================= */

function confetti(count = 100) {

    for(let i = 0; i < count; i++) {

        const c = document.createElement("div");

        c.className = "confetti";

        const symbols = ["♥","✦","●","◆","★"];

        c.innerText =
            symbols[Math.floor(Math.random() * symbols.length)];

        c.style.left =
            Math.random() * 100 + "vw";

        c.style.fontSize =
            (8 + Math.random() * 15) + "px";

        c.style.animationDuration =
            (2.5 + Math.random() * 3) + "s";

        c.style.animationDelay =
            Math.random() * .8 + "s";

        document.body.appendChild(c);

        setTimeout(() => c.remove(), 6000);
    }
}


/* =========================================================
   SCREEN HELPER
   ========================================================= */

function render(content, extraClass = "") {

    app.innerHTML = `
        <div class="screen ${extraClass}">
            ${content}
        </div>
    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   START SCREEN
   ========================================================= */

function startScreen() {

    render(`

        <div class="card">

            <div class="big-heart">❤️</div>

            <div class="script">
                A little something for you...
            </div>

            <h1>
                Hey, ${HER}
            </h1>

            <p class="subtitle">
                I made you a tiny game.
                <br>
                There are 5 levels.
                <br><br>
                And there might be a little surprise
                waiting at the end...
            </p>

            <button class="btn" onclick="startGame()">
                Start Our Story 💕
            </button>

        </div>
    `);
}


/* =========================================================
   START GAME
   ========================================================= */

function startGame() {

    level = 1;
    score = 0;

    showLevel1();
}


/* =========================================================
   PROGRESS
   ========================================================= */

function progressHTML() {

    return `
        <div class="progress-wrap">

            <div class="progress-top">
                <span>Our little journey</span>
                <span>Level ${level} / 5</span>
            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    style="width:${(level/5)*100}%"
                ></div>
            </div>

        </div>
    `;
}


/* =========================================================
   LEVEL 1
   ========================================================= */

const questions = [

    {
        question: "What do you think makes me smile the most?",
        answers: [
            "You ❤️",
            "Money 💰",
            "Food 🍕",
            "Sleeping 😴"
        ],
        correct: 0
    },

    {
        question: "If we could disappear somewhere together, what sounds best?",
        answers: [
            "A cozy little trip 🌙",
            "Office work 💻",
            "Grocery shopping 🛒",
            "Standing in a queue 😭"
        ],
        correct: 0
    },

    {
        question: "What is my favorite thing about you?",
        answers: [
            "Your heart ❤️",
            "Your kindness 🌸",
            "Your smile 😊",
            "All of the above 💖"
        ],
        correct: 3
    }

];

let questionIndex = 0;

function showLevel1() {

    questionIndex = 0;

    renderLevel1Question();
}


function renderLevel1Question() {

    const q = questions[questionIndex];

    render(`

        <div class="card">

            ${progressHTML()}

            <div class="question-number">
                Level 1 • Question ${questionIndex + 1}
            </div>

            <h2>${q.question}</h2>

            <div class="answers">

                ${q.answers.map((answer, i) => `

                    <button
                        class="answer"
                        onclick="answerQuestion(${i})"
                    >
                        ${answer}
                    </button>

                `).join("")}

            </div>

            <p>
                Don't overthink it... 👀
            </p>

        </div>
    `);
}


function answerQuestion(index) {

    const q = questions[questionIndex];

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(btn => btn.disabled = true);

    if(index === q.correct) {

        buttons[index].classList.add("correct");

        score += 10;

        sparkle(
            window.innerWidth / 2,
            window.innerHeight / 2
        );

    } else {

        buttons[index].classList.add("wrong");

        buttons[q.correct].classList.add("correct");
    }

    setTimeout(() => {

        questionIndex++;

        if(questionIndex >= questions.length) {

            showLevelComplete(
                1,
                "Not bad... ❤️",
                "You survived the first level.",
                showLevel2
            );

        } else {

            renderLevel1Question();

        }

    }, 900);
}


/* =========================================================
   LEVEL COMPLETE
   ========================================================= */

function showLevelComplete(
    completedLevel,
    title,
    message,
    nextFunction
) {

    confetti(50);

    render(`

        <div class="card">

            <div class="big-heart">💖</div>

            <div class="question-number">
                LEVEL ${completedLevel} COMPLETE
            </div>

            <h2>${title}</h2>

            <p class="subtitle">
                ${message}
            </p>

            <button class="btn" onclick="(${nextFunction.name})()">
                Continue 💕
            </button>

        </div>
    `);
}


/* =========================================================
   LEVEL 2 — CATCH HEARTS
   ========================================================= */

let heartsCaught = 0;
let heartsNeeded = 8;
let heartTimer;
let heartInterval;

function showLevel2() {

    heartsCaught = 0;

    render(`

        <div class="card">

            ${progressHTML()}

            <div class="question-number">
                Level 2 • Catch My Heart
            </div>

            <h2>
                Catch the hearts! 💕
            </h2>

            <p>
                You have 20 seconds.
                <br>
                Catch at least ${heartsNeeded} hearts.
            </p>

            <div class="game-stats">

                <div class="stat">
                    <strong id="heartScore">0</strong>
                    <span>HEARTS</span>
                </div>

                <div class="stat">
                    <strong id="heartTime">20</strong>
                    <span>SECONDS</span>
                </div>

            </div>

            <div
                class="game-area"
                id="heartGame"
            ></div>

        </div>
    `);

    startHeartGame();
}


function startHeartGame() {

    let time = 20;

    heartTimer = setInterval(() => {

        time--;

        const timer =
            document.getElementById("heartTime");

        if(timer)
            timer.innerText = time;

        if(time <= 0) {

            clearInterval(heartTimer);
            clearInterval(heartInterval);

            if(heartsCaught >= heartsNeeded) {

                showLevelComplete(
                    2,
                    "You caught my heart! ❤️",
                    "Okay... that was actually adorable.",
                    showLevel3
                );

            } else {

                render(`

                    <div class="card">

                        <div class="big-heart">🥺</div>

                        <h2>Almost!</h2>

                        <p class="subtitle">
                            My heart is a little slippery.
                            <br>
                            Let's try again.
                        </p>

                        <button
                            class="btn"
                            onclick="showLevel2()"
                        >
                            Try Again 💗
                        </button>

                    </div>
                `);

            }
        }

    }, 1000);

    heartInterval = setInterval(spawnHeart, 650);
}


function spawnHeart() {

    const area =
        document.getElementById("heartGame");

    if(!area) return;

    const heart =
        document.createElement("div");

    heart.className = "catch-heart";

    const choices =
        ["❤️","💖","💗","💘","💕"];

    heart.innerText =
        choices[Math.floor(Math.random() * choices.length)];

    const maxX =
        area.clientWidth - 45;

    const maxY =
        area.clientHeight - 45;

    heart.style.left =
        Math.max(5, Math.random() * maxX) + "px";

    heart.style.top =
        Math.max(5, Math.random() * maxY) + "px";

    heart.onclick = function(e) {

        heartsCaught++;

        score += 5;

        document.getElementById("heartScore").innerText =
            heartsCaught;

        sparkle(
            e.clientX,
            e.clientY
        );

        heart.remove();

        if(heartsCaught >= heartsNeeded) {

            clearInterval(heartTimer);
            clearInterval(heartInterval);

            setTimeout(() => {

                showLevelComplete(
                    2,
                    "You caught my heart! ❤️",
                    "And somehow you made it look easy.",
                    showLevel3
                );

            }, 300);

        }
    };

    area.appendChild(heart);

    setTimeout(() => {

        if(heart.isConnected)
            heart.remove();

    }, 1400);
}


/* =========================================================
   LEVEL 3 — MEMORY
   ========================================================= */

let memoryValues = [];
let firstCard = null;
let secondCard = null;
let lockBoard = false;
let matchedPairs = 0;

function showLevel3() {

    const emojis = [
        "❤️","❤️",
        "🌹","🌹",
        "💍","💍",
        "🌙","🌙",
        "✨","✨",
        "🥰","🥰",
        "💕","💕",
        "💋","💋"
    ];

    memoryValues =
        emojis.sort(() => Math.random() - .5);

    matchedPairs = 0;
    firstCard = null;
    secondCard = null;
    lockBoard = false;

    render(`

        <div class="card">

            ${progressHTML()}

            <div class="question-number">
                Level 3 • Memory of Us
            </div>

            <h2>
                Find the matching hearts 💞
            </h2>

            <p>
                Match all the pairs to unlock the next level.
            </p>

            <div
                class="memory-grid"
                id="memoryGrid"
            ></div>

        </div>
    `);

    createMemoryBoard();
}


function createMemoryBoard() {

    const grid =
        document.getElementById("memoryGrid");

    memoryValues.forEach((value, index) => {

        const card =
            document.createElement("div");

        card.className = "memory-card";

        card.dataset.value = value;
        card.dataset.index = index;

        card.innerText = "💗";

        card.onclick =
            () => flipCard(card);

        grid.appendChild(card);
    });
}


function flipCard(card) {

    if(lockBoard) return;
    if(card === firstCard) return;
    if(card.classList.contains("matched")) return;

    card.classList.add("flipped");
    card.innerText = card.dataset.value;

    if(!firstCard) {

        firstCard = card;
        return;
    }

    secondCard = card;

    checkMemoryMatch();
}


function checkMemoryMatch() {

    const match =
        firstCard.dataset.value ===
        secondCard.dataset.value;

    if(match) {

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        matchedPairs++;

        resetMemoryCards();

        if(matchedPairs === 8) {

            setTimeout(() => {

                showLevelComplete(
                    3,
                    "You remembered them all! ✨",
                    "Maybe that's a sign we should make more memories together.",
                    showLevel4
                );

            }, 600);
        }

    } else {

        lockBoard = true;

        setTimeout(() => {

            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");

            firstCard.innerText = "💗";
            secondCard.innerText = "💗";

            resetMemoryCards();

        }, 800);
    }
}


function resetMemoryCards() {

    [firstCard, secondCard] =
        [null, null];

    lockBoard = false;
}


/* =========================================================
   LEVEL 4 — CHOICES
   ========================================================= */

function showLevel4() {

    render(`

        <div class="card">

            ${progressHTML()}

            <div class="question-number">
                Level 4 • One Important Question
            </div>

            <h2>
                What should we do together? 🌙
            </h2>

            <p>

                but choose carefully. 👀
            </p>

            <div class="choice-container">

                <div
                    class="choice"
                    onclick="chooseLove('movie')"
                >
                    <div class="choice-icon">🎬</div>
                    <strong>Movie Night</strong>
                    <p>Blanket + snacks + you.</p>
                </div>

                <div
                    class="choice"
                    onclick="chooseLove('trip')"
                >
                    <div class="choice-icon">🌍</div>
                    <strong>Little Trip</strong>
                    <p>Just disappear somewhere.</p>
                </div>

                <div
                    class="choice"
                    onclick="chooseLove('food')"
                >

                    <strong>Food Date</strong>
                    <p>Because food makes everything better.</p>
                </div>

                <div
                    class="choice"
                    onclick="chooseLove('forever')"
                >

                    <strong>Something More</strong>
                    <p>Maybe... forever?</p>
                </div>

            </div>

        </div>
    `);
}


function chooseLove(choice) {

    let message = "";

    if(choice === "movie") {

        message =
            "Good choice. But I'm probably going to spend half the movie looking at you. 😌❤️";

    } else if(choice === "trip") {

        message =
            "Pack your bags. Somewhere beautiful sounds better when you're there. 🌍💕";

    } else if(choice === "food") {

        message =
            "Excellent choice. I'll bring the food. You just bring that smile. 😋❤️";

    } else {

        message =
            "Hmm... now THAT is the answer I was hoping for. 👀💍❤️";

    }

    render(`

        <div class="card">

            <div class="big-heart">🥰</div>

            <h2>
                I like your answer.
            </h2>

            <p class="subtitle">
                ${message}
            </p>

            <button
                class="btn"
                onclick="showLevel5()"
            >
                One More Level 💖
            </button>

        </div>
    `);
}

    render(`

        <div class="card">

            </div>

            </div>

/* =========================================================
   RUNAWAY NO BUTTON
   ========================================================= */

function runAway() {

    const btn =
        document.getElementById("noButton");

    if(!btn) return;

    btn.style.position = "fixed";

    const maxX =
        window.innerWidth - btn.offsetWidth - 20;

    const maxY =
        window.innerHeight - btn.offsetHeight - 20;

    btn.style.left =
        Math.random() * maxX + "px";

    btn.style.top =
        Math.random() * maxY + "px";

    btn.innerText =
        ["Are you sure? 🥺",
         "Try again 😭",
         "Nope 😂",
         "You can't escape ❤️",
         "Nice try 😏"][Math.floor(Math.random()*5)];

    sparkle(
        Math.random() * window.innerWidth,
        Math.random() * window.innerHeight
    );
}

/* =========================================================
   FINAL HEART EXPLOSION
   ========================================================= */

function createMassiveHeartExplosion() {

    const hearts =
        ["❤️","💖","💕","💗","💘","💓","💞","✨"];

    for(let i = 0; i < 70; i++) {

        const h =
            document.createElement("div");

        h.style.position = "fixed";
        h.style.left = "50%";
        h.style.top = "50%";
        h.style.zIndex = "999";
        h.style.pointerEvents = "none";

        h.innerText =
            hearts[Math.floor(Math.random()*hearts.length)];

        const angle =
            Math.random() * Math.PI * 2;

        const distance =
            100 + Math.random() * 450;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;

        h.animate(
            [
                {
                    transform: "translate(-50%, -50%) scale(.2)",
                    opacity: 1
                },
                {
                    transform:
                        `translate(calc(-50% + ${x}px),
                                   calc(-50% + ${y}px))
                         scale(${.7 + Math.random()})`,
                    opacity: 0
                }
            ],
            {
                duration: 1500 + Math.random()*1000,
                easing: "cubic-bezier(.2,.8,.3,1)"
            }
        );

        document.body.appendChild(h);

        setTimeout(() => h.remove(), 2800);
    }
}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame() {

    startScreen();
}

document.addEventListener("click", function(e) {

            e.clientX,
            e.clientY
        );
    }

});


/* =========================================================

   ========================================================= */

startScreen();

</script>
