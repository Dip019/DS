<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100810">

<title>আমাদের Date ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0c070d;
    --bg2:#170b17;
    --card:#191019;
    --card2:#211420;
    --pink:#ff4d7f;
    --pink2:#ff8eae;
    --text:#fff;
    --muted:#b9a9b6;
    --border:rgba(255,255,255,.10);
}

html{
    min-height:100%;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 85% 10%,
            rgba(255,70,125,.13),
            transparent 27%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(135,80,190,.10),
            transparent 28%
        ),
        linear-gradient(
            145deg,
            var(--bg),
            var(--bg2)
        );

    color:var(--text);

    font-family:
        "Noto Serif Bengali",
        "Nirmala UI",
        "Vrinda",
        Georgia,
        serif;

    overflow-x:hidden;
}

/* =========================
   STARS
========================= */

#stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    opacity:.4;
    animation:twinkle 3s ease-in-out infinite;
}

@keyframes twinkle{
    0%,100%{opacity:.18}
    50%{opacity:.65}
}

/* =========================
   APP
========================= */

#app{
    position:relative;
    z-index:1;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.page{
    width:min(760px,100%);

    animation:pageIn .35s ease;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   CARD
========================= */

.card{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.02)
        );

    border:1px solid var(--border);

    border-radius:26px;

    padding:
        clamp(22px,5vw,46px);

    box-shadow:
        0 22px 60px rgba(0,0,0,.32);

    text-align:center;
}

/* =========================
   TEXT
========================= */

.kicker{
    color:var(--pink2);
    font-size:12px;
    letter-spacing:1.5px;
    margin-bottom:10px;
}

h1{
    font-size:clamp(40px,8vw,70px);
    line-height:1.2;
}

h2{
    font-size:clamp(27px,5vw,41px);
    line-height:1.4;
    margin-bottom:10px;
}

p{
    color:var(--muted);
    line-height:1.85;
    font-size:16px;
}

.script{
    color:var(--pink2);
    font-size:21px;
    font-style:italic;
}

/* =========================
   HEART
========================= */

.big-heart{
    font-size:65px;
    line-height:1;
    margin-bottom:20px;

    animation:heartbeat 1.8s ease-in-out infinite;
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.08);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.05);
    }
}

/* =========================
   PROGRESS
========================= */

.progress{
    margin-bottom:30px;
}

.progress-top{
    display:flex;
    justify-content:space-between;

    color:#887885;
    font-size:12px;

    margin-bottom:7px;
}

.progress-track{
    height:5px;
    border-radius:20px;

    background:rgba(255,255,255,.07);

    overflow:hidden;
}

.progress-fill{
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ed396d,
            #ff92af
        );

    border-radius:20px;

    transition:width .3s ease;
}

/* =========================
   BUTTONS
========================= */

.btn{
    border:none;
    outline:none;

    padding:13px 26px;

    min-height:48px;

    border-radius:50px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #ed3a6d,
            #ff7099
        );

    font-family:inherit;
    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    margin-top:20px;

    box-shadow:
        0 8px 22px rgba(255,60,115,.20);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 11px 26px rgba(255,60,115,.28);
}

.btn:active{
    transform:scale(.97);
}

.btn.secondary{
    background:#241725;
    border:1px solid var(--border);
    box-shadow:none;
}

.btn.small{
    padding:10px 18px;
    min-height:42px;
    font-size:14px;
}

/* =========================
   OPTION GRID
========================= */

.option-grid{
    display:grid;
    gap:12px;

    margin:28px auto;

    max-width:650px;
}

.grid-2{
    grid-template-columns:repeat(2,1fr);
}

.grid-3{
    grid-template-columns:repeat(3,1fr);
}

.option{
    width:100%;

    border:1px solid var(--border);

    background:
        rgba(255,255,255,.035);

    color:white;

    border-radius:17px;

    padding:18px 12px;

    font-family:inherit;
    font-size:15px;

    cursor:pointer;

    transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
}

.option:hover{
    transform:translateY(-2px);
}

.option.selected{
    background:
        rgba(255,70,120,.12);

    border-color:
        rgba(255,110,150,.65);
}

.icon{
    display:block;
    font-size:28px;
    margin-bottom:6px;
}

.small-text{
    color:#8d7d8b;
    font-size:12px;
    margin-top:4px;
}

/* =========================
   FORM
========================= */

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.form-group{
    text-align:left;
    margin:18px 0;
}

label{
    display:block;

    color:#e4afc1;

    font-size:14px;

    margin-bottom:8px;
}

input,
textarea,
select{
    width:100%;

    border:1px solid var(--border);

    border-radius:13px;

    background:#0d080e;

    color:white;

    padding:13px 14px;

    font-family:inherit;
    font-size:15px;

    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:rgba(255,100,145,.7);
}

textarea{
    min-height:125px;
    resize:vertical;
}

/* =========================
   NAVIGATION
========================= */

.nav{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;

    margin-top:24px;
}

.nav .btn{
    margin-top:0;
}

/* =========================
   SUMMARY
========================= */

.summary-head{
    padding:25px 18px;

    margin:22px 0;

    border-radius:20px;

    border:1px solid var(--border);

    background:
        linear-gradient(
            135deg,
            rgba(255,70,120,.10),
            rgba(150,80,190,.07)
        );
}

.summary-title{
    color:#ffabc3;
    font-size:29px;
    margin-bottom:5px;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;

    text-align:left;
}

.summary-item{
    padding:16px;

    border-radius:15px;

    border:1px solid var(--border);

    background:
        rgba(255,255,255,.035);
}

.summary-icon{
    font-size:21px;
    margin-bottom:4px;
}

.summary-item small{
    display:block;

    color:#817180;

    font-size:11px;

    margin-bottom:5px;
}

.summary-item strong{
    display:block;

    color:white;

    font-size:14px;

    line-height:1.7;

    word-break:break-word;
}

.message{
    text-align:left;

    margin-top:12px;

    padding:17px;

    border-left:
        3px solid var(--pink);

    border-radius:
        0 14px 14px 0;

    background:
        rgba(255,70,120,.06);
}

.message-title{
    color:var(--pink2);
    font-size:12px;
}

.message p{
    color:white;
    margin-top:6px;
}

.success{
    margin-top:18px;

    padding:13px;

    border-radius:13px;

    color:#ffb3c8;

    background:
        rgba(255,70,120,.055);
}

/* =========================
   PDF AREA
   Kept off-screen, not display:none
========================= */

#pdfContainer{
    position:fixed;

    left:-10000px;
    top:0;

    width:794px;

    background:white;

    z-index:-999;

    pointer-events:none;
}

.pdf-page{
    width:794px;
    min-height:1123px;

    padding:65px;

    background:
        linear-gradient(
            145deg,
            #fff8fb,
            #ffffff
        );

    color:#24151f;

    font-family:
        "Noto Serif Bengali",
        "Nirmala UI",
        "Vrinda",
        Georgia,
        serif;
}

.pdf-inner{
    min-height:993px;

    border:2px solid #e8b3c6;

    border-radius:24px;

    padding:45px;

    position:relative;
}

.pdf-heart{
    text-align:center;

    color:#e83d6e;

    font-family:Arial,sans-serif;

    font-size:52px;

    margin-bottom:8px;
}

.pdf-kicker{
    text-align:center;

    color:#a64a68;

    font-family:Arial,sans-serif;

    font-size:11px;

    letter-spacing:3px;
}

.pdf-title{
    text-align:center;

    color:#842b4c;

    font-size:36px;

    font-weight:bold;

    margin-top:9px;
}

.pdf-names{
    text-align:center;

    color:#896071;

    font-size:14px;

    margin-top:5px;
}

.pdf-date{
    margin:34px auto 26px;

    padding:19px;

    max-width:560px;

    text-align:center;

    background:#fff0f5;

    border:1px solid #efc1d0;

    border-radius:17px;
}

.pdf-date-label{
    color:#ad5674;

    font-size:12px;
}

.pdf-date-value{
    color:#63233e;

    font-size:21px;

    font-weight:bold;

    margin-top:4px;
}

.pdf-section{
    margin-top:25px;
}

.pdf-section-title{
    color:#963957;

    font-size:16px;

    font-weight:bold;

    border-bottom:1px solid #ecd3dc;

    padding-bottom:8px;

    margin-bottom:4px;
}

.pdf-row{
    display:flex;

    gap:15px;

    padding:11px 0;

    border-bottom:1px solid #f0e0e6;
}

.pdf-label{
    width:120px;

    color:#987080;

    font-size:12px;

    flex-shrink:0;
}

.pdf-value{
    color:#30202a;

    font-size:13px;

    line-height:1.7;

    word-break:break-word;
}

.pdf-message{
    margin-top:24px;

    padding:17px;

    background:#fff3f7;

    border-left:4px solid #e64273;

    border-radius:0 12px 12px 0;
}

.pdf-message-title{
    color:#a33e60;

    font-size:13px;

    font-weight:bold;
}

.pdf-message-text{
    color:#34232c;

    font-size:13px;

    line-height:1.8;

    margin-top:7px;
}

.pdf-footer{
    position:absolute;

    bottom:34px;

    left:45px;
    right:45px;

    text-align:center;

    color:#a47787;

    font-family:Arial,sans-serif;

    font-size:10px;
}

.pdf-footer strong{
    display:block;

    color:#8d3151;

    font-size:12px;

    margin-bottom:3px;
}

/* =========================
   LOADING
========================= */

.loading{
    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(10,5,10,.92);

    color:white;

    font-size:17px;

    text-align:center;
}

.loading-box{
    padding:25px;

    border-radius:18px;

    background:#1c111d;

    border:1px solid var(--border);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #app{
        padding:12px;
    }

    .card{
        padding:23px 16px;
        border-radius:22px;
    }

    .grid-2,
    .grid-3,
    .summary-grid,
    .form-row{
        grid-template-columns:1fr;
    }

    .option{
        padding:16px 10px;
    }

    h1{
        font-size:43px;
    }

    p{
        font-size:15px;
    }

    .nav{
        flex-wrap:wrap;
    }

}

/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }

}

</style>
</head>

<body>

<div id="stars"></div>

<div id="app"></div>

<div id="pdfContainer"></div>


<script>

/* =========================================================
   PERSONALIZE THESE TWO NAMES
========================================================= */

const YOUR_NAME = "তোমার মানুষ";
const HER_NAME = "রূপালী";


/* =========================================================
   DATA
========================================================= */

const plan = {
    date:"",
    time:"",
    duration:"",
    location:"",
    customLocation:"",
    food:[],
    customFood:"",
    dress:"",
    customDress:"",
    activities:[],
    note:""
};

let currentStep = 0;


/* =========================================================
   SMALL HELPERS
========================================================= */

const app = document.getElementById("app");


function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function show(html){

    app.innerHTML = html;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function goBack(){

    if(currentStep <= 1){
        home();
        return;
    }

    currentStep--;

    if(currentStep===1) step1();
    if(currentStep===2) step2();
    if(currentStep===3) step3();
    if(currentStep===4) step4();
    if(currentStep===5) step5();
    if(currentStep===6) step6();
}


/* =========================================================
   STARS
========================================================= */

function createStars(){

    const box =
        document.getElementById("stars");

    for(let i=0;i<35;i++){

        const star =
            document.createElement("span");

        star.className="star";

        star.style.left =
            Math.random()*100+"%";

        star.style.top =
            Math.random()*100+"%";

        star.style.animationDelay =
            Math.random()*3+"s";

        box.appendChild(star);
    }
}


/* =========================================================
   HOME
========================================================= */

function home(){

    currentStep=0;

    show(`

        <main class="page">

            <section class="card">

                <div class="big-heart">
                    ❤️
                </div>

                <div class="script">
                    একটা ছোট্ট প্রশ্ন...
                </div>

                <h1>
                    ${escapeHTML(HER_NAME)}
                </h1>

                <p style="max-width:570px;margin:18px auto">

                    আমার সাথে একটা Date-এ যাবে? 🌹

                    <br><br>

                    এবার আমাদের Date-এর পুরো plan
                    তুমি নিজেই বানাবে।

                    <br>

                    আমি শুধু তোমার সাথে থাকব। ❤️

                </p>


                <div class="option-grid grid-3">

                    <button
                        class="option"
                        onclick="startDate()">

                        <span class="icon">
                            💕
                        </span>

                        অবশ্যই!

                    </button>


                    <button
                        class="option"
                        onclick="startDate()">

                        <span class="icon">
                            🌹
                        </span>

                        চল যাই!

                    </button>


                    <button
                        class="option"
                        onclick="startDate()">

                        <span class="icon">
                            😌
                        </span>

                        এতক্ষণে জিজ্ঞেস করছো?

                    </button>

                </div>

            </section>

        </main>

    `);
}


/* =========================================================
   PROGRESS
========================================================= */

function progress(step,title){

    return `

        <div class="progress">

            <div class="progress-top">

                <span>
                    ${title}
                </span>

                <span>
                    ${step} / 6
                </span>

            </div>

            <div class="progress-track">

                <div
                    class="progress-fill"
                    style="width:${step/6*100}%">
                </div>

            </div>

        </div>

    `;
}


/* =========================================================
   START
========================================================= */

function startDate(){

    currentStep=1;

    step1();
}


/* =========================================================
   STEP 1
========================================================= */

function step1(){

    currentStep=1;

    show(`

        <main class="page">

            <section class="card">

                ${progress(1,"কবে দেখা হবে?")}

                <div class="kicker">
                    STEP 01
                </div>

                <h2>
                    আমাদের Date কবে? 📅
                </h2>

                <p>
                    একটা সুন্দর দিন আর সময় বেছে নাও।
                </p>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            📅 তারিখ
                        </label>

                        <input
                            id="dateInput"
                            type="date"
                            value="${plan.date}">

                    </div>


                    <div class="form-group">

                        <label>
                            🕐 সময়
                        </label>

                        <input
                            id="timeInput"
                            type="time"
                            value="${plan.time}">

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        ⏳ কতক্ষণ?
                    </label>

                    <select id="durationInput">

                        <option value="">
                            বেছে নাও
                        </option>

                        <option ${
                            plan.duration==="১–২ ঘণ্টা"
                            ? "selected":""
                        }>
                            ১–২ ঘণ্টা
                        </option>

                        <option ${
                            plan.duration==="২–৩ ঘণ্টা"
                            ? "selected":""
                        }>
                            ২–৩ ঘণ্টা
                        </option>

                        <option ${
                            plan.duration==="৩–৫ ঘণ্টা"
                            ? "selected":""
                        }>
                            ৩–৫ ঘণ্টা
                        </option>

                        <option ${
                            plan.duration==="পুরো দিন ❤️"
                            ? "selected":""
                        }>
                            পুরো দিন ❤️
                        </option>

                    </select>

                </div>


                <div class="nav">

                    <button
                        class="btn"
                        onclick="saveStep1()">

                        পরের ধাপ ✨

                    </button>

                </div>

            </section>

        </main>

    `);
}


function saveStep1(){

    const date =
        document.getElementById("dateInput").value;

    const time =
        document.getElementById("timeInput").value;

    const duration =
        document.getElementById("durationInput").value;


    if(!date){

        alert("Date-এর তারিখটা বেছে নাও ❤️");
        return;
    }

    if(!time){

        alert("Date-এর সময়টাও বেছে নাও 🕐");
        return;
    }

    if(!duration){

        alert("Date কতক্ষণ হবে সেটা বেছে নাও ⏳");
        return;
    }


    plan.date=date;
    plan.time=time;
    plan.duration=duration;

    currentStep=2;

    step2();
}


/* =========================================================
   STEP 2 LOCATION
========================================================= */

function step2(){

    currentStep=2;

    show(`

        <main class="page">

            <section class="card">

                ${progress(2,"কোথায় যাব?")}

                <div class="kicker">
                    STEP 02
                </div>

                <h2>
                    কোথায় দেখা হবে? 📍
                </h2>

                <p>
                    একটা জায়গা বেছে নাও।
                </p>


                <div class="option-grid grid-2">

                    ${locationOption(
                        "☕",
                        "Café",
                        "Coffee + গল্প",
                        "Café"
                    )}

                    ${locationOption(
                        "🍽️",
                        "Restaurant",
                        "একসাথে খাওয়া",
                        "Restaurant"
                    )}

                    ${locationOption(
                        "🌳",
                        "Park",
                        "হাঁটাহাঁটি + গল্প",
                        "Park"
                    )}

                </div>


                <div class="form-group">

                    <label>
                        📍 অথবা তোমার যে location ভালো লাগে
                    </label>

                    <input
                        id="locationInput"
                        value="${escapeHTML(plan.customLocation)}"
                        placeholder="যেমন: তোমার যেখানে ভালো লাগে">

                </div>


                <div class="nav">

                    <button
                        class="btn secondary"
                        onclick="goBack()">

                        ← পিছনে

                    </button>

                    <button
                        class="btn"
                        onclick="saveStep2()">

                        পরের ধাপ ✨

                    </button>

                </div>

            </section>

        </main>

    `);
}


function locationOption(icon,title,desc,value){

    const selected =
        plan.location===value &&
        !plan.customLocation;

    return `

        <button
            class="option ${selected?"selected":""}"
            data-location="${escapeHTML(value)}"

/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value){

    if(!value)
        return "—";

    const parts =
        value.split("-");

    const date =
        new Date(
            Number(parts[0]),
            Number(parts[1])-1,
            Number(parts[2])
        );

    return date.toLocaleDateString(
        "bn-BD",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );
}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(value){

    if(!value)
        return "—";

    const parts =
        value.split(":");

    let hours =
        Number(parts[0]);

    const minutes =
        parts[1];

    const ampm =
        hours>=12 ? "PM" : "AM";

    hours =
        hours%12 || 12;

    return `${hours}:${minutes} ${ampm}`;
}

   LOCATION
========================================================= */

function locationText(){

    return plan.customLocation ||
           plan.location ||
           "—";
}


/* =========================================================
   LOAD SCRIPT ONLY WHEN PDF IS NEEDED
========================================================= */

function loadScript(src){

    return new Promise(
        (resolve,reject)=>{

            const existing =
                document.querySelector(
                    `script[src="${src}"]`
                );

            if(existing){

                existing.addEventListener(
                    "load",
                    resolve
                );

                existing.addEventListener(
                    "error",
                    reject
                );

                return;
            }

            const script =
                document.createElement("script");

            script.src=src;

            script.onload=resolve;
            script.onerror=reject;

            document.head.appendChild(script);

        }
    );
}

/* =========================================================
   ACTUAL PDF DOWNLOAD
========================================================= */

async function downloadPDF(){

    const loading =
        document.createElement("div");

    loading.className="loading";

    loading.innerHTML=`

        <div class="loading-box">

            <div style="font-size:35px;margin-bottom:10px">
                💖
            </div>

            PDF তৈরি হচ্ছে...

            <br>

            <small style="color:#a996a5">
                একটু অপেক্ষা করো
            </small>

        </div>

    `;

    document.body.appendChild(loading);


    try{

        /*
           These libraries are loaded ONLY when the
           user actually asks for a PDF.
        */

        await loadScript(
            "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
        );

        await loadScript(
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
        );


        const container =
            document.getElementById(
                "pdfContainer"
            );

        container.innerHTML =
            buildPDF();


        /*
           Give the browser a moment to render
           Bengali text and layout.
        */

        await new Promise(
            resolve=>setTimeout(resolve,300)
        );


        const pdfElement =
            container.querySelector(
                ".pdf-page"
            );


        const canvas =
            await html2canvas(
                pdfElement,
                {
                    scale:1.5,
                    useCORS:true,
                    backgroundColor:"#ffffff",
                    logging:false
                }
            );


        const image =
            canvas.toDataURL(
                "image/jpeg",
                .95
            );


        const {
            jsPDF
        } =
            window.jspdf;


        const pdf =
            new jsPDF({
                orientation:"portrait",
                unit:"mm",
                format:"a4"
            });


        const pageWidth =
            210;

        const pageHeight =
            297;


        pdf.addImage(
            image,
            "JPEG",
            0,
            0,
            pageWidth,
            pageHeight,
            undefined,
            "FAST"
        );


        const fileName =
            "Our-Date-Plan-" +
            (
                plan.date ||
                "date"
            ) +
            ".pdf";


        pdf.save(fileName);


        container.innerHTML="";


    }catch(error){

        console.error(error);

        alert(
            "PDF তৈরি করা যায়নি।\n\n" +
            "ইন্টারনেট connection আছে কিনা " +
            "check করে আবার চেষ্টা করো।"
        );

    }finally{

        loading.remove();

    }
}
