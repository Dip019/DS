<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Love Escape Room</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: rgba(26, 21, 43, 0.85);
            --accent-pink: #ff2a6d;
            --accent-purple: #7000ff;
            --accent-cyan: #05d9e8;
            --text-color: #f4f4f9;
            --glow-pink: 0 0 20px rgba(255, 42, 109, 0.6);
            --glow-cyan: 0 0 20px rgba(5, 217, 232, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Animated Glows */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(112, 0, 255, 0.2) 0%, rgba(15, 12, 27, 0) 70%);
            animation: float 10s ease-in-out infinite alternate;
            z-index: 0;
        }

        .bg-glow.two {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 42, 109, 0.15) 0%, rgba(15, 12, 27, 0) 70%);
            bottom: -100px;
            right: -100px;
            animation-duration: 14s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-50px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), var(--glow-pink);
            text-align: center;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .room-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .instruction {
            font-size: 1rem;
            margin-bottom: 25px;
            color: #d1d1e9;
            line-height: 1.5;
        }

        /* Room 1: Hidden Objects */
        .grid-objects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .item-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.8rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .item-box:hover {
            border-color: var(--accent-pink);
            background: rgba(255, 42, 109, 0.1);
            transform: translateY(-3px);
        }

        .item-box.found {
            background: rgba(5, 217, 232, 0.2);
            border: 2px solid var(--accent-cyan);
            box-shadow: var(--glow-cyan);
            pointer-events: none;
        }

        /* Room 2: 4-Digit Code */
        .code-display {
            font-size: 2rem;
            letter-spacing: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 280px;
            margin: 0 auto 20px auto;
        }

        .num-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            font-size: 1.2rem;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .num-btn:hover {
            background: var(--accent-purple);
            border-color: var(--accent-pink);
            box-shadow: var(--glow-pink);
        }

        /* Room 3: Visual Puzzle */
        .puzzle-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .puzzle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 20px;
            border-radius: 10px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            text-align: left;
        }

        .puzzle-btn:hover {
            background: rgba(255, 42, 109, 0.2);
            border-color: var(--accent-pink);
            transform: translateX(5px);
        }

        /* Room 4: Key Finder */
        .safe-box {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px auto;
            background: linear-gradient(135deg, #2b2345, #151026);
            border: 3px solid var(--accent-pink);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            cursor: pointer;
            box-shadow: var(--glow-pink);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .safe-box:hover {
            transform: scale(1.05) rotate(3deg);
        }

        .safe-box.unlocked {
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
            background: linear-gradient(135deg, #103545, #0a1b26);
        }

        /* Room 5: Final Door */
        .door-frame {
            width: 140px;
            height: 200px;
            margin: 0 auto 25px auto;
            border: 4px solid var(--accent-pink);
            border-top-left-radius: 70px;
            border-top-right-radius: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: var(--glow-pink);
            position: relative;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        .door-frame.open {
            background: #fff;
            box-shadow: 0 0 50px #fff, 0 0 100px var(--accent-pink);
            transform: scale(1.1);
        }

        .door-handle {
            width: 15px;
            height: 15px;
            background: var(--accent-cyan);
            border-radius: 50%;
            position: absolute;
            right: 20px;
            box-shadow: var(--glow-cyan);
        }

        /* Feedback / Error Messages */
        .feedback {
            font-size: 0.9rem;
            min-height: 20px;
            margin-top: 10px;
            color: var(--accent-pink);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Darkness / Cinematic Ending Overlay */
        #darkness-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #darkness-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .ending-text {
            color: #fff;
            font-size: 1.8rem;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .ending-text.show {
            opacity: 1;
            transform: translateY(0);
        }

        .ending-text.heart {
            color: var(--accent-pink);
            font-size: 2.2rem;
            text-shadow: var(--glow-pink);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
            width: 20%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow two"></div>

    <div class="container" id="game-container">
        <!-- Progress Indicator -->
        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <!-- Dynamic Room Content Loaded via JavaScript -->
        <div id="room-content"></div>
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- Cinematic Ending Overlay -->
    <div id="darkness-overlay">
        <div class="ending-text" id="line1">“You escaped the room...”</div>
        <div class="ending-text heart" id="line2">“But you're trapped in my heart.” ❤️</div>
    </div>

    <script>
        let currentRoom = 1;
        const totalRooms = 5;

        // State for Room 1
        let foundCount = 0;
        
        // State for Room 2
        let enteredCode = "";
        const secretCode = "1428"; // Meaningful date/numbers (e.g., Feb 14 or customizable)

        function updateProgress() {
            const progressPercent = (currentRoom / totalRooms) * 100;
            document.getElementById('progress').style.width = `${progressPercent}%`;
        }

        function showFeedback(msg, isSuccess = false) {
            const fb = document.getElementById('feedback');
            fb.style.color = isSuccess ? 'var(--accent-cyan)' : 'var(--accent-pink)';
            fb.textContent = msg;
            setTimeout(() => {
                if(fb.textContent === msg) fb.textContent = "";
            }, 3000);
        }

        // --- ROOM 1: Find Hidden Objects ---
        function renderRoom1() {
            updateProgress();
            const content = `
                <div class="room-title">Room 1: The Chamber of Echoes</div>
                <div class="instruction">Find the 3 hidden memory artifacts scattered around the room.</div>
                <div class="grid-objects" id="obj-grid">
                    <div class="item-box" onclick="findObject(this, true)">🧸</div>
                    <div class="item-box" onclick="findObject(this, false)">📦</div>
                    <div class="item-box" onclick="findObject(this, true)">💌</div>
                    <div class="item-box" onclick="findObject(this, false)">🪞</div>
                    <div class="item-box" onclick="findObject(this, true)">🌹</div>
                    <div class="item-box" onclick="findObject(this, false)">🕯️</div>
                </div>
            `;
            document.getElementById('room-content').innerHTML = content;
        }

        function findObject(element, isTarget) {
            if (element.classList.contains('found')) return;

            if (isTarget) {
                element.classList.add('found');
                foundCount++;
                showFeedback("Artifact secured! ✨", true);
                if (foundCount === 3) {
                    setTimeout(() => {
                        currentRoom = 2;
                        renderRoom2();
                    }, 1000);
                }
            } else {
                showFeedback("Nothing here... keep looking!");
                element.style.transform = "translateX(5px)";
                setTimeout(() => element.style.transform = "none", 200);
            }
        }

        // --- ROOM 2: Crack a 4-Digit Code ---
        function renderRoom2() {
            updateProgress();
            enteredCode = "";
            const content = `
                <div class="room-title">Room 2: The Digital Vault</div>
                <div class="instruction">Crack the 4-digit code. Hint: The month and day we first met (MMDD). Try 0214!</div>
                <div class="code-display" id="code-display">----</div>
                <div class="numpad">
                    <button class="num-btn" onclick="pressNum('1')">1</button>
                    <button class="num-btn" onclick="pressNum('2')">2</button>
                    <button class="num-btn" onclick="pressNum('3')">3</button>
                    <button class="num-btn" onclick="pressNum('4')">4</button>
                    <button class="num-btn" onclick="pressNum('5')">5</button>
                    <button class="num-btn" onclick="pressNum('6')">6</button>
                    <button class="num-btn" onclick="pressNum('7')">7</button>
                    <button class="num-btn" onclick="pressNum('8')">8</button>
                    <button class="num-btn" onclick="pressNum('9')">9</button>
                    <button class="num-btn" onclick="pressNum('C')" style="background: rgba(255,42,109,0.2)">C</button>
                    <button class="num-btn" onclick="pressNum('0')">0</button>
                    <button class="num-btn" onclick="pressNum('OK')" style="background: rgba(5,217,232,0.2)">✓</button>
                </div>
            `;
            document.getElementById('room-content').innerHTML = content;
        }

        function pressNum(num) {
            if (num === 'C') {
                enteredCode = "";
            } else if (num === 'OK') {
                if (enteredCode === secretCode) {
                    showFeedback("Access Granted! 🔓", true);
                    setTimeout(() => {
                        currentRoom = 3;
                        renderRoom3();
                    }, 1000);
                    return;
                } else {
                    showFeedback("Incorrect Code. Try 0214!");
                    enteredCode = "";
                }
            } else {
                if (enteredCode.length < 4) {
                    enteredCode += num;
                }
            }
            
            let displayStr = enteredCode.padEnd(4, '-');
            document.getElementById('code-display').textContent = displayStr;
        }

        // --- ROOM 3: Visual Puzzle ---
        function renderRoom3() {
            updateProgress();
            const content = `
                <div class="room-title">Room 3: The Hall of Mirrors</div>
                <div class="instruction">Solve the visual puzzle: Which phrase completes my favorite thought about you?</div>
                <div class="puzzle-options">
                    <button class="puzzle-btn" onclick="checkPuzzle(false)">A) "You are moderately nice."</button>
                    <button class="puzzle-btn" onclick="checkPuzzle(true)">B) "Every puzzle leads me straight to you."</button>
                    <button class="puzzle-btn" onclick="checkPuzzle(false)">C) "Let's grab some coffee later."</button>
                </div>
            `;
            document.getElementById('room-content').innerHTML = content;
        }

        function checkPuzzle(isCorrect) {
            if (isCorrect) {
                showFeedback("Puzzle Solved! Perfect match. 🧩", true);
                setTimeout(() => {
                    currentRoom = 4;
                    renderRoom4();
                }, 1000);
            } else {
                showFeedback("That doesn't feel right. Try again!");
            }
        }

        // --- ROOM 4: Find Hidden Key ---
        function renderRoom4() {
            updateProgress();
            const content = `
                <div class="room-title">Room 4: The Sealed Relic</div>
                <div class="instruction">Tap the glowing lock box to break the seal and discover the hidden key.</div>
                <div class="safe-box" id="safe" onclick="unlockSafe()">🔒</div>
            `;
            document.getElementById('room-content').innerHTML = content;
        }

        function unlockSafe() {
            const safe = document.getElementById('safe');
            safe.innerHTML = "🔑";
            safe.classList.add('unlocked');
            showFeedback("Hidden Key Acquired! 🗝️", true);
            setTimeout(() => {
                currentRoom = 5;
                renderRoom5();
            }, 1200);
        }

        // --- ROOM 5: Unlock Final Door ---
        function renderRoom5() {
            updateProgress();
            const content = `
                <div class="room-title">Room 5: The Exit</div>
                <div class="instruction">Use your key. Tap the door to unlock your freedom.</div>
                <div class="door-frame" id="final-door" onclick="openFinalDoor()">
                    <div class="door-handle"></div>
                </div>
            `;
            document.getElementById('room-content').innerHTML = content;
        }

        function openFinalDoor() {
            const door = document.getElementById('final-door');
            door.classList.add('open');
            
            // Trigger Cinematic Darkness Ending Sequence
            setTimeout(() => {
                const overlay = document.getElementById('darkness-overlay');
                overlay.classList.add('active');

                setTimeout(() => {
                    document.getElementById('line1').classList.add('show');
                }, 1000);

                setTimeout(() => {
                    document.getElementById('line2').classList.add('show');
                }, 3500);

            }, 800);
        }

        // Initialize Game on Load
        renderRoom1();
    </script>
</body>
</html>
