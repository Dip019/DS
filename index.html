<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমাদের Date Plan ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =========================================================
   ROOT
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --pink:#ff477e;
    --pink2:#ff8eaf;
    --rose:#e92d63;
    --purple:#8c62d9;

    --dark:#08050b;
    --dark2:#130914;

    --glass:rgba(255,255,255,.075);
    --border:rgba(255,255,255,.12);

    --text:#fff;
    --muted:rgba(255,255,255,.65);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,60,120,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(130,70,220,.16),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #050308,
            #160a17 50%,
            #08040d
        );

    color:var(--text);
    font-family:"Noto Serif Bengali",serif;
}

/* =========================================================
   BACKGROUND
========================================================= */

#background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.4;

    animation:
        twinkle 2s infinite alternate;
}

@keyframes twinkle{

    from{
        opacity:.15;
        transform:scale(.6);
    }

    to{
        opacity:1;
        transform:scale(1.4);
    }
}

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.25;
    animation:glowFloat 12s ease-in-out infinite alternate;
}

.glow.one{
    width:350px;
    height:350px;
    background:#ff2e6d;
    left:-180px;
    top:15%;
}

.glow.two{
    width:400px;
    height:400px;
    background:#7747e8;
    right:-220px;
    bottom:-150px;
    animation-delay:3s;
}

@keyframes glowFloat{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(70px,-40px);
    }
}

/* =========================================================
   FLOATING HEARTS
========================================================= */

#floatingHearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:2;
}

.heartParticle{
    position:absolute;
    bottom:-40px;
    opacity:0;
    animation:heartRise linear forwards;
}

@keyframes heartRise{

    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:.6;
    }

    90%{
        opacity:.4;
    }

    100%{
        transform:
            translateY(-110vh)
            rotate(360deg);
        opacity:0;
    }
}

/* =========================================================
   APP
========================================================= */

#app{
    position:relative;
    z-index:5;

    width:100%;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;
}

.page{
    width:min(850px,100%);
    animation:pageIn .7s ease;
}

@keyframes pageIn{

    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.98);
        filter:blur(7px);
    }

    to{
        opacity:1;
        transform:none;
        filter:blur(0);
    }
}

/* =========================================================
   GLASS CARD
========================================================= */

.card{
    width:100%;

    padding:
        clamp(28px,6vw,55px);

    border-radius:34px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.085),
            rgba(255,255,255,.025)
        );

    border:1px solid var(--border);

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    box-shadow:
        0 35px 100px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.07);

    text-align:center;
}

/* =========================================================
   TYPOGRAPHY
========================================================= */

.script{
    font-family:"Tiro Bangla",serif;
    font-style:italic;
    color:#ff9ebc;
}

.eyebrow{
    font-size:12px;
    letter-spacing:3px;
    color:#ff9bb9;
    margin-bottom:15px;
}

h1{
    font-size:clamp(38px,8vw,75px);
    line-height:1.2;
}

h2{
    font-size:clamp(28px,5vw,45px);
    line-height:1.35;
    margin-bottom:14px;
}

p{
    color:var(--muted);
    font-size:16px;
    line-height:1.9;
}

/* =========================================================
   HERO HEART
========================================================= */

.heroHeart{
    width:130px;
    height:130px;

    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:65px;

    position:relative;

    animation:heartbeat 1.5s infinite;

    filter:
        drop-shadow(
            0 0 25px
            rgba(255,50,110,.7)
        );
}

.heroHeart:before,
.heroHeart:after{

    content:"";

    position:absolute;
    inset:0;

    border:1px solid rgba(255,90,140,.22);

    border-radius:50%;

    animation:ring 2.5s infinite;
}

.heroHeart:after{
    animation-delay:1s;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.12);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.08);
    }
}

@keyframes ring{

    from{
        transform:scale(.7);
        opacity:.8;
    }

    to{
        transform:scale(1.7);
        opacity:0;
    }
}

/* =========================================================
   BUTTON
========================================================= */

.btn{

    border:0;
    outline:0;

    padding:15px 28px;

    min-height:48px;

    border-radius:999px;

    font-family:inherit;
    font-size:15px;
    font-weight:600;

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff3d77,
            #ff7fa5
        );

    cursor:pointer;

    margin-top:20px;

    box-shadow:
        0 12px 35px rgba(255,50,110,.25);

    transition:.3s ease;
}

.btn:hover{

    transform:
        translateY(-3px)
        scale(1.02);

    box-shadow:
        0 18px 45px
        rgba(255,50,110,.4);
}

.btn:active{
    transform:scale(.97);
}

.btn.secondary{

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:none;
}

/* =========================================================
   YES OPTIONS
========================================================= */

.yesOptions{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;

    max-width:650px;

    margin:35px auto 0;
}

.yesOption{

    padding:22px 15px;

    border-radius:22px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.045);

    cursor:pointer;

    transition:.3s;
}

.yesOption:hover{

    transform:translateY(-6px);

    background:
        rgba(255,70,130,.1);

    border-color:
        rgba(255,100,160,.4);
}

.yesOption .emoji{
    font-size:35px;
    margin-bottom:8px;
}

.yesOption strong{
    display:block;
    font-size:16px;
}

/* =========================================================
   PROGRESS
========================================================= */

.progressArea{
    max-width:700px;
    margin:0 auto 35px;
}

.progressInfo{

    display:flex;
    justify-content:space-between;

    font-size:12px;

    color:rgba(255,255,255,.45);

    margin-bottom:8px;
}

.progress{

    width:100%;
    height:6px;

    background:
        rgba(255,255,255,.08);

    border-radius:99px;

    overflow:hidden;
}

.progressBar{

    height:100%;

    border-radius:99px;

    background:
        linear-gradient(
            90deg,
            #ff3f78,
            #ff9cbb,
            #9b70e8
        );

    transition:
        width .5s ease;
}

/* =========================================================
   FORM
========================================================= */

.formGroup{

    max-width:650px;

    margin:25px auto;

    text-align:left;
}

label{

    display:block;

    margin-bottom:9px;

    font-size:14px;

    color:#ffb0c6;
}

input,
textarea,
select{

    width:100%;

    border:
        1px solid
        rgba(255,255,255,.12);

    outline:0;

    border-radius:16px;

    padding:15px 16px;

    color:white;

    font-family:inherit;

    font-size:16px;

    background:
        rgba(0,0,0,.2);

    transition:.25s;
}

select option{
    background:#170c18;
    color:white;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{

    border-color:
        rgba(255,100,160,.7);

    box-shadow:
        0 0 0 3px
        rgba(255,70,130,.08);
}

/* =========================================================
   DATE/TIME
========================================================= */

.dateTimeGrid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;
}

/* =========================================================
   LOCATION CARDS
========================================================= */

.locationGrid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

    max-width:700px;

    margin:30px auto;
}

.locationCard{

    padding:22px;

    border-radius:22px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.045);

    cursor:pointer;

    transition:.3s;
}

.locationCard.selected{

    background:
        rgba(255,70,130,.12);

    border-color:
        rgba(255,100,160,.65);

    box-shadow:
        0 0 25px
        rgba(255,60,120,.1);
}

.locationCard:hover{
    transform:translateY(-4px);
}

.locationIcon{
    font-size:36px;
    margin-bottom:8px;
}

/* =========================================================
   FOOD GRID
========================================================= */

.foodGrid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:13px;

    max-width:700px;

    margin:30px auto;
}

.foodCard{

    padding:18px 10px;

    border-radius:18px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.1);

    cursor:pointer;

    transition:.3s;
}

.foodCard.selected{

    background:
        rgba(255,70,130,.12);

    border-color:
        rgba(255,100,160,.65);

}

.foodCard:hover{
    transform:translateY(-3px);
}

.foodEmoji{
    font-size:32px;
}

/* =========================================================
   COLORS
========================================================= */

.colorGrid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;

    max-width:600px;

    margin:30px auto;
}

.colorChoice{

    padding:15px 8px;

    border-radius:18px;

    border:
        1px solid
        rgba(255,255,255,.1);

    cursor:pointer;

    background:
        rgba(255,255,255,.04);

    transition:.3s;
}

.colorChoice.selected{

    border-color:white;

    transform:
        translateY(-4px)
        scale(1.02);

}

.colorCircle{

    width:40px;
    height:40px;

    margin:auto auto 8px;

    border-radius:50%;

    border:2px solid
        rgba(255,255,255,.4);
}

/* =========================================================
   ACTIVITIES
========================================================= */

.activityGrid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:14px;

    max-width:650px;

    margin:30px auto;
}

.activity{

    padding:20px;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.045);

    cursor:pointer;

    text-align:left;

    transition:.3s;
}

.activity.selected{

    background:
        rgba(255,70,130,.12);

    border-color:
        rgba(255,100,160,.6);
}

.activity:hover{
    transform:translateY(-3px);
}

.activity span{
    font-size:25px;
    margin-right:8px;
}

/* =========================================================
   SUMMARY
========================================================= */

.summaryHero{

    padding:30px;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,70,130,.12),
            rgba(120,70,220,.1)
        );

    border:
        1px solid
        rgba(255,255,255,.1);

    margin:25px 0;
}

.summaryTitle{

    font-family:"Tiro Bangla",serif;

    font-size:34px;

    color:#ffabc4;
}

.summaryGrid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:14px;

    margin-top:25px;

    text-align:left;
}

.summaryItem{

    padding:20px;

    border-radius:20px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.08);
}

.summaryItem .icon{
    font-size:24px;
    margin-bottom:7px;
}

.summaryItem small{

    display:block;

    color:
        rgba(255,255,255,.4);

    font-size:12px;

    margin-bottom:5px;
}

.summaryItem strong{
    font-size:16px;
    color:#fff;
}

.noteBox{

    margin-top:18px;

    padding:22px;

    border-radius:20px;

    text-align:left;

    background:
        rgba(255,70,130,.07);

    border-left:
        3px solid
        #ff5b91;
}

/* =========================================================
   CONFETTI
========================================================= */

.confetti{

    position:fixed;

    top:-20px;

    z-index:100;

    pointer-events:none;

    animation:
        fall linear forwards;
}

@keyframes fall{

    to{

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:650px){

    #app{
        padding:14px;
    }

    .card{
        border-radius:27px;
    }

    .yesOptions{
        grid-template-columns:1fr;
    }

    .locationGrid{
        grid-template-columns:1fr;
    }

    .foodGrid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .colorGrid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .activityGrid{
        grid-template-columns:1fr;
    }

    .summaryGrid{
        grid-template-columns:1fr;
    }

    .dateTimeGrid{
        grid-template-columns:1fr;
    }

    h1{
        font-size:45px;
    }

    p{
        font-size:15px;
    }
}

</style>
</head>


<body>

<!-- =====================================================
     BACKGROUND
===================================================== -->

<div id="background">

    <div class="glow one"></div>
    <div class="glow two"></div>

</div>

<div id="floatingHearts"></div>

<div id="app"></div>


<script>

/* =========================================================
   ❤️ PERSONALIZATION
========================================================= */

const YOUR_NAME = "তোমার মানুষ";

const HER_NAME = "আমার প্রিয়";


/* =========================================================
   STATE
========================================================= */

const datePlan = {

    going:false,

    date:"",
    time:"",

    location:"",
    customLocation:"",

    food:[],

    dressColor:"",

    activities:[],

    note:""

};


/* =========================================================
   ELEMENT
========================================================= */

const app =
    document.getElementById("app");


/* =========================================================
   BACKGROUND STARS
========================================================= */

function createStars(){

    const bg =
        document.getElementById("background");

    for(let i=0;i<120;i++){

        const star =
            document.createElement("div");

        star.className="star";

        star.style.left =
            Math.random()*100+"%";

        star.style.top =
            Math.random()*100+"%";

        const size =
            Math.random()*2.5+.5;

        star.style.width=size+"px";
        star.style.height=size+"px";

        star.style.animationDelay =
            Math.random()*4+"s";

        bg.appendChild(star);
    }
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

function floatingHeart(){

    const heart =
        document.createElement("div");

    heart.className="heartParticle";

    const icons=[
        "♡",
        "♥",
        "💕",
        "💗",
        "✨"
    ];

    heart.innerText =
        icons[
            Math.floor(
                Math.random()*icons.length
            )
        ];

    heart.style.left =
        Math.random()*100+"%";

    heart.style.fontSize =
        (12+Math.random()*18)+"px";

    heart.style.animationDuration =
        (8+Math.random()*8)+"s";

    document
        .getElementById("floatingHearts")
        .appendChild(heart);

    setTimeout(
        ()=>heart.remove(),
        17000
    );
}

setInterval(floatingHeart,800);


/* =========================================================
   RENDER
========================================================= */

function render(html){

    app.innerHTML=html;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   CONFETTI
========================================================= */

function confetti(amount=80){

    const symbols=[
        "♥",
        "💕",
        "✨",
        "♡",
        "✦"
    ];

    for(let i=0;i<amount;i++){

        const c =
            document.createElement("div");

        c.className="confetti";

        c.innerText =
            symbols[
                Math.floor(
                    Math.random()*symbols.length
                )
            ];

        c.style.left =
            Math.random()*100+"vw";

        c.style.fontSize =
            (10+Math.random()*15)+"px";

        c.style.animationDuration =
            (2.5+Math.random()*3)+"s";

        c.style.animationDelay =
            Math.random()*.8+"s";

        document.body.appendChild(c);

        setTimeout(
            ()=>c.remove(),
            6000
        );
    }
}


/* =========================================================
   STEP HEADER
========================================================= */

function stepHeader(step,title){

    return `

        <div class="progressArea">

            <div class="progressInfo">

                <span>
                    আমাদের Date Plan
                </span>

                <span>
                    ${step} / 7
                </span>

            </div>

            <div class="progress">

                <div
                    class="progressBar"
                    style="width:${(step/7)*100}%">
                </div>

            </div>

        </div>

        <div class="eyebrow">
            ধাপ ${step} • ${title}
        </div>
    `;
}


/* =========================================================
   PAGE 1
========================================================= */

function home(){

    render(`

        <div class="page">

            <div class="card">

                <div class="heroHeart">
                    ❤️
                </div>

                <div class="script"
                     style="font-size:23px">

                    একটা গুরুত্বপূর্ণ প্রশ্ন আছে...

                </div>

                <h1>
                    ${HER_NAME}
                </h1>

                <p style="max-width:600px;margin:20px auto">

                    আমার সাথে একটা Date-এ যাবে? 🌹

                    <br><br>

                    এইবার কিন্তু শুধু "হ্যাঁ" বললেই হবে না...
                    <br>
                    আমাদের পুরো Date-টা তোমাকেই plan করতে হবে। 😌

                </p>

                <div class="yesOptions">

                    <div
                        class="yesOption"
                        onclick="startPlan('yes')">

                        <div class="emoji">
                            💕
                        </div>

                        <strong>
                            অবশ্যই যাব!
                        </strong>

                    </div>


                    <div
                        class="yesOption"
                        onclick="startPlan('yes')">

                        <div class="emoji">
                            🌹
                        </div>

                        <strong>
                            হ্যাঁ, চল!
                        </strong>

                    </div>


                    <div
                        class="yesOption"
                        onclick="startPlan('yes')">

                        <div class="emoji">
                            😌
                        </div>

                        <strong>
                            এতক্ষণে জিজ্ঞেস করছো?
                        </strong>

                    </div>

                </div>

            </div>

        </div>

    `);
}


/* =========================================================
   START
========================================================= */

function startPlan(){

    datePlan.going=true;

    step1();
}


/* =========================================================
   STEP 1 — DATE
========================================================= */

function step1(){

    render(`

        <div class="page">

            <div class="card">

                ${stepHeader(
                    1,
                    "কবে দেখা হবে?"
                )}

                <h2>
                    আমাদের Date কবে? 🌙
                </h2>

                <p>
                    এমন একটা দিন বেছে নাও
                    যেদিন শুধু আমাদের জন্য একটু সময় থাকবে।
                </p>

                <div class="formGroup">

                    <label>
                        📅 Date
                    </label>

                    <input
                        id="dateInput"
                        type="date"
                    >

                </div>

                <div class="dateTimeGrid">

                    <div class="formGroup">

                        <label>
                            🕐 দেখা হবে কয়টায়?
                        </label>

                        <input
                            id="timeInput"
                            type="time"
                        >

                    </div>

                    <div class="formGroup">

                        <label>
                            ⏳ আনুমানিক কতক্ষণ?
                        </label>

                        <select id="durationInput">

                            <option value="">
                                বেছে নাও
                            </option>

                            <option>
                                ১–২ ঘণ্টা
                            </option>

                            <option>

/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(value){

    if(!value)
        return "—";

    const parts =
        value.split("-");

    const d =
        new Date(
            Number(parts[0]),
            Number(parts[1])-1,
            Number(parts[2])
        );

    return d.toLocaleDateString(
        "bn-BD",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );
}


function formatTime(value){

    if(!value)
        return "—";

    const [h,m]=
        value.split(":");

    let hour=
        parseInt(h);

    const minute=m;

    const suffix =
        hour>=12
        ? "PM"
        : "AM";

    hour =
        hour%12 || 12;

    return `${hour}:${minute} ${suffix}`;
}


function locationText(){

    if(
        datePlan.customLocation
    )
        return datePlan.customLocation;

    return datePlan.location;
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
