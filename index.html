<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#120914">

<title>আমাদের Date Plan ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">

<style>

/* =========================================================
   LIGHTWEIGHT ROMANTIC DATE PLANNER
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0b060d;
    --bg2:#170a18;
    --card:#18101b;
    --card2:#21131f;
    --pink:#ff4d82;
    --pink-light:#ff9fbd;
    --text:#fff;
    --muted:#bcaebb;
    --line:rgba(255,255,255,.10);
}

html{
    min-height:100%;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 85% 10%,
            rgba(255,65,125,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(130,75,200,.10),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            var(--bg),
            var(--bg2)
        );

    color:var(--text);
    font-family:"Noto Serif Bengali",serif;
}

/* =========================================================
   SIMPLE STARS
========================================================= */

#stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    opacity:.45;
    animation:twinkle 3s ease-in-out infinite;
}

@keyframes twinkle{
    0%,100%{opacity:.2}
    50%{opacity:.8}
}

/* =========================================================
   APP
========================================================= */

#app{
    position:relative;
    z-index:1;
    min-height:100vh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.page{
    width:min(760px,100%);
    animation:pageIn .45s ease;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   CARD
========================================================= */

.card{
    width:100%;
    padding:clamp(25px,5vw,48px);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border:1px solid var(--line);
    border-radius:28px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);

    text-align:center;
}

/* =========================================================
   TYPOGRAPHY
========================================================= */

.script{
    font-family:"Tiro Bangla",serif;
    font-style:italic;
    color:var(--pink-light);
}

.eyebrow{
    font-size:12px;
    letter-spacing:2px;
    color:var(--pink-light);
    margin-bottom:12px;
}

h1{
    font-size:clamp(38px,8vw,70px);
    line-height:1.2;
}

h2{
    font-size:clamp(27px,5vw,42px);
    line-height:1.4;
    margin-bottom:12px;
}

p{
    color:var(--muted);
    line-height:1.9;
    font-size:16px;
}

/* =========================================================
   HEART
========================================================= */

.hero-heart{
    font-size:72px;
    line-height:1;
    margin-bottom:22px;

    animation:
        heartBeat 1.8s ease-in-out infinite;
}

@keyframes heartBeat{
    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.08);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.05);
    }
}

/* =========================================================
   BUTTON
========================================================= */

.btn{
    border:0;
    min-height:48px;

    padding:13px 27px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #ef396e,
            #ff709b
        );

    color:#fff;

    font-family:inherit;
    font-size:15px;
    font-weight:600;

    cursor:pointer;

    margin-top:22px;

    box-shadow:
        0 8px 25px rgba(255,55,110,.22);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 12px 30px rgba(255,55,110,.32);
}

.btn:active{
    transform:scale(.97);
}

.btn.secondary{
    background:#251726;
    border:1px solid var(--line);
    box-shadow:none;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-area{
    margin-bottom:32px;
}

.progress-top{
    display:flex;
    justify-content:space-between;

    font-size:12px;
    color:#897987;

    margin-bottom:7px;
}

.progress{
    height:5px;

    background:
        rgba(255,255,255,.07);

    border-radius:20px;

    overflow:hidden;
}

.progress-bar{
    height:100%;

    background:
        linear-gradient(
            90deg,
            #e9366d,
            #ff91b0
        );

    border-radius:20px;

    transition:width .35s ease;
}

/* =========================================================
   FORM
========================================================= */

.form-group{
    max-width:620px;
    margin:22px auto;
    text-align:left;
}

label{
    display:block;
    color:#e6b1c3;
    font-size:14px;
    margin-bottom:8px;
}

input,
textarea,
select{
    width:100%;

    padding:14px 15px;

    background:#0e090f;

    color:#fff;

    border:1px solid var(--line);

    border-radius:14px;

    font-family:inherit;
    font-size:16px;

    outline:none;

    transition:border-color .2s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:rgba(255,100,150,.6);
}

textarea{
    min-height:120px;
    resize:vertical;
}

select option{
    background:#170c18;
}

/* =========================================================
   GRID
========================================================= */

.grid{
    display:grid;
    gap:12px;
}

.two{
    grid-template-columns:repeat(2,1fr);
}

.three{
    grid-template-columns:repeat(3,1fr);
}

/* =========================================================
   LOCATION
========================================================= */

.option{
    padding:20px 12px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid var(--line);

    border-radius:18px;

    cursor:pointer;

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
}

.option:hover{
    transform:translateY(-2px);
}

.option.selected{
    background:
        rgba(255,70,120,.10);

    border-color:
        rgba(255,100,150,.65);
}

.option-icon{
    font-size:32px;
    margin-bottom:7px;
}

.option-title{
    font-weight:600;
}

.option-description{
    color:#8e7f8e;
    font-size:12px;
    margin-top:4px;
}

/* =========================================================
   FOOD
========================================================= */

.food{
    padding:17px 10px;
}

.food .option-icon{
    font-size:27px;
}

/* =========================================================
   COLOR
========================================================= */

.color{
    padding:15px 8px;
}

.color-circle{
    width:38px;
    height:38px;
    border-radius:50%;

    margin:0 auto 7px;

    border:2px solid rgba(255,255,255,.25);
}

.color.selected{
    border-color:#fff;

    box-shadow:
        0 0 0 2px rgba(255,100,150,.3);
}

/* =========================================================
   ACTIVITIES
========================================================= */

.activity{
    text-align:left;
    padding:17px;
}

.activity-icon{
    font-size:24px;
    margin-right:7px;
}

/* =========================================================
   SUMMARY
========================================================= */

.summary-head{
    padding:28px 20px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            rgba(255,70,120,.10),
            rgba(140,80,200,.08)
        );

    border:1px solid var(--line);

    margin:20px 0;
}

.summary-title{
    font-family:"Tiro Bangla",serif;
    font-size:30px;
    color:#ffabc3;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
    text-align:left;
}

.summary-item{
    padding:17px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--line);
    border-radius:17px;
}

.summary-item small{
    display:block;
    color:#827482;
    font-size:11px;
    margin-bottom:5px;
}

.summary-item strong{
    display:block;
    color:#fff;
    font-size:15px;
    line-height:1.6;
}

.summary-icon{
    font-size:22px;
    margin-bottom:5px;
}

.note{
    text-align:left;
    margin-top:12px;
    padding:18px;

    border-left:
        3px solid var(--pink);

    border-radius:
        0 15px 15px 0;

    background:
        rgba(255,70,120,.06);
}

.note small{
    color:var(--pink-light);
}

.note p{
    color:#fff;
    margin-top:7px;
}

/* =========================================================
   SUCCESS
========================================================= */

.success{
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    color:#ffb5ca;
    background:rgba(255,70,120,.07);
    border:1px solid rgba(255,100,150,.12);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    #app{
        padding:12px;
    }

    .card{
        padding:25px 17px;
        border-radius:23px;
    }

    .two,
    .three,
    .summary-grid{
        grid-template-columns:1fr;
    }

    .food{
        padding:15px 8px;
    }

    h1{
        font-size:43px;
    }

    p{
        font-size:15px;
    }
}

/* =========================================================
   PRINT / PDF
========================================================= */

@media print{

    @page{
        size:A4;
        margin:0;
    }

    body{
        background:#fff !important;
        color:#211421 !important;
    }

    #stars,
    #app{
        display:none !important;
    }

    #printPage{
        display:block !important;
    }
}

#printPage{
    display:none;
}

/* =========================================================
   PRINT DESIGN
========================================================= */

.print-sheet{
    width:210mm;
    min-height:297mm;

    padding:18mm;

    background:
        linear-gradient(
            145deg,
            #fff8fb,
            #fff
        );

    color:#241622;

    font-family:"Noto Serif Bengali",serif;

    position:relative;
}

.print-border{
    position:absolute;
    inset:9mm;

    border:1px solid #edb7c8;
    border-radius:8mm;

    pointer-events:none;
}

.print-cover{
    text-align:center;

    padding-top:22mm;
    padding-bottom:14mm;
}

.print-heart{
    font-size:45px;
    color:#e8396b;
}

.print-kicker{
    color:#b75a78;
    font-size:11px;
    letter-spacing:2px;
    margin-top:8px;
}

.print-title{
    font-family:"Tiro Bangla",serif;
    font-size:32px;
    color:#8e294d;
    margin-top:8px;
}

.print-subtitle{
    font-size:13px;
    color:#755b68;
    margin-top:7px;
}

.print-date{
    margin:14mm auto 7mm;

    width:150mm;

    padding:7mm;

    border-radius:6mm;

    background:#fff0f5;

    border:1px solid #f0c4d2;

    text-align:center;
}

.print-date-label{
    color:#ae5876;
    font-size:10px;
}

.print-date-value{
    color:#5f243a;
    font-size:19px;
    font-weight:600;
    margin-top:3px;
}

.print-section{
    margin-top:8mm;
}

.print-section-title{
    color:#9d3e61;
    font-size:13px;
    font-weight:700;

    padding-bottom:3mm;

    border-bottom:
        1px solid #efd0da;
}

.print-row{
    display:flex;

    padding:4mm 0;

    border-bottom:
        1px solid #f2e2e7;
}

.print-label{
    width:38mm;

    color:#9a7482;

    font-size:10px;
}

.print-value{
    flex:1;

    color:#30202a;

    font-size:12px;

    line-height:1.7;
}

.print-note{
    margin-top:8mm;

    padding:6mm;

    background:#fff4f7;

    border-left:
        3px solid #e84a78;

    border-radius:
        0 4mm 4mm 0;
}

.print-note-title{
    color:#a53e61;
    font-size:11px;
}

.print-note-text{
    margin-top:3mm;
    font-size:12px;
    line-height:1.8;
}

.print-footer{
    position:absolute;

    bottom:17mm;

    left:0;
    right:0;

    text-align:center;

    color:#ad7b8d;

    font-size:9px;
}

.print-footer strong{
    display:block;
    color:#923450;
    font-size:11px;
    margin-bottom:2px;
}

</style>
</head>


<body>

<!-- =====================================================
     BACKGROUND
===================================================== -->

<div id="stars"></div>

<!-- =====================================================
     APP
===================================================== -->

<div id="app"></div>


<!-- =====================================================
     PRINT PDF PAGE
===================================================== -->

<div id="printPage">

    <div class="print-sheet">

        <div class="print-border"></div>

        <div class="print-cover">

            <div class="print-heart">
                ♥
            </div>

            <div class="print-kicker">
                A DATE MADE WITH LOVE
            </div>

            <div class="print-title">
                আমাদের Date Plan
            </div>

            <div class="print-subtitle">
                ${HER_NAME} ♥ ${YOUR_NAME}
            </div>

            <div class="print-date">

                <div class="print-date-label">
                    আমাদের দেখা করার দিন
                </div>

                <div
                    class="print-date-value"
                    id="printDate">
                </div>

                <div
                    class="print-subtitle"
                    id="printTime">
                </div>

            </div>

        </div>


        <div class="print-section">

            <div class="print-section-title">
                ✦ Date Details
            </div>

            <div class="print-row">

                <div class="print-label">
                    📍 কোথায়
                </div>

                <div
                    class="print-value"
                    id="printLocation">
                </div>

            </div>

            <div class="print-row">

                <div class="print-label">
                    🍽️ কী খাব
                </div>

                <div
                    class="print-value"
                    id="printFood">
                </div>

            </div>

            <div class="print-row">

                <div class="print-label">
                    👗 Dress
                </div>

                <div
                    class="print-value"
                    id="printDress">
                </div>

            </div>

            <div class="print-row">

                <div class="print-label">
                    ✨ কী করব
                </div>

                <div
                    class="print-value"
                    id="printActivities">
                </div>

            </div>

        </div>


        <div
            class="print-note"
            id="printNoteBox">

            <div class="print-note-title">
                💌 তোমার জন্য একটা কথা
            </div>

            <div
                class="print-note-text"
                id="printNote">
            </div>

        </div>


        <div class="print-footer">

            <strong>
                ${YOUR_NAME} ♥ ${HER_NAME}
            </strong>

            এই Date Plan-টা একদিন একটা সুন্দর স্মৃতি হয়ে যাবে।

        </div>

    </div>

</div>


<script>

/* =========================================================
   PERSONALIZE
========================================================= */

const YOUR_NAME = "তোমার মানুষ";
const HER_NAME = "আমার প্রিয়";


/* =========================================================
   STATE
========================================================= */

const plan = {

    date:"",
    time:"",
    location:"",
    customLocation:"",
    food:[],
    dress:"",
    activities:[],
    note:""

};


/* =========================================================
   APP
========================================================= */

const app =
    document.getElementById("app");


/* =========================================================
   STARS
   Only 45 stars — deliberately lightweight.
========================================================= */

function createStars(){

    const stars =
        document.getElementById("stars");

    for(let i=0;i<45;i++){

        const s =
            document.createElement("div");

        s.className="star";

        s.style.left =
            Math.random()*100+"%";

        s.style.top =
            Math.random()*100+"%";

        s.style.animationDelay =
            Math.random()*3+"s";

        stars.appendChild(s);
    }
}


/* =========================================================
   RENDER
========================================================= */

function render(html){

    app.innerHTML = html;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   HOME
========================================================= */

function home(){

    render(`

        <main class="page">

            <section class="card">

                <div class="hero-heart">
                    ❤️
                </div>

                <div class="script">
                    একটা ছোট্ট প্রশ্ন...
                </div>

                <h1>
                    ${HER_NAME}
                </h1>

                <p style="max-width:570px;margin:20px auto">

                    আমার সাথে একটা Date-এ যাবে? 🌹

                    <br><br>

                    তবে এবার Date-এর পুরো plan
                    তোমাকেই করতে হবে।

                    <br>

                    আমি শুধু তোমার plan follow করব। 😌

                </p>


                <div
                    class="grid three"
                    style="margin-top:30px">

                    <button
                        class="option"
                        type="button"
                        onclick="start()">

                        <div class="option-icon">
                            💕
                        </div>

                        <div class="option-title">
                            অবশ্যই!
                        </div>

                    </button>


                    <button
                        class="option"
                        type="button"
                        onclick="start()">

                        <div class="option-icon">
                            🌹
                        </div>

                        <div class="option-title">
                            চল যাই!
                        </div>

                    </button>


                    <button
                        class="option"
                        type="button"
                        onclick="start()">

                        <div class="option-icon">
                            😌
                        </div>

                        <div class="option-title">
                            এতক্ষণে জিজ্ঞেস করছো?
                        </div>

                    </button>

                </div>

            </section>

        </main>

    `);

}


/* =========================================================
   PROGRESS
========================================================= */

function progress(step,title){

    return `

        <div class="progress-area">

            <div class="progress-top">

                <span>
                    ${title}
                </span>

                <span>
                    ${step} / 7
                </span>

            </div>

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${step/7*100}%">
                </div>

            </div>

        </div>

    `;
}


/* =========================================================
   START
========================================================= */

function start(){

    step1();

}


/* =========================================================
   STEP 1
========================================================= */

function step1(){

    render(`

        <main class="page">

            <section class="card">

                ${progress(
                    1,
                    "কবে দেখা হবে?"
                )}

                <div class="eyebrow">
                    প্রথমে একটা দিন ঠিক করি
                </div>

                <h2>
                    আমাদের Date কবে? 📅
                </h2>

                <p>
                    এমন একটা দিন বেছে নাও
                    যেদিন দুজনেরই সময় থাকবে।
                </p>


                <div class="dateTimeGrid"
                     style="
                        max-width:620px;
                        margin:auto;
                        display:grid;
                        grid-template-columns:1fr 1fr;
                        gap:14px;
                     ">

                    <div class="form-group">

                        <label>
                            📅 তারিখ
                        </label>

                        <input
                            id="date"
                            type="date">

                    </div>


                    <div class="form-group">

                        <label>
                            🕐 সময়
                        </label>

                        <input
                            id="time"
                            type="time">

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        ⏳ Date কতক্ষণ চলবে?
                    </label>

                    <select id="duration">

                        <option value="">
                            বেছে নাও
                        </option>

                        <option>
                            ১–২ ঘণ্টা
                        </option>

                        <option>
                            ২–৩ ঘণ্টা
                        </option>

                        <option>
                            ৩–৫ ঘণ্টা
                        </option>

                        <option>
                            পুরো দিন ❤️
                        </option>

                    </select>

                </div>


                <button
                    class="btn"
                    type="button"
                    onclick="save1()">

                    পরের ধাপ ✨

                </button>

            </section>

        </main>

    `);

}


/* =========================================================
   SAVE 1
========================================================= */

function save1(){

    const date =
        document.getElementById("date").value;

    const time =
        document.getElementById("time").value;

    if(!date || !time){

        alert(
            "তারিখ আর সময় দুটোই বেছে নাও ❤️"
        );

        return;
    }

    plan.date=date;
    plan.time=time;

    step2();
}


/* =========================================================
   STEP 2
========================================================= */

function step2(){

    render(`

        <main class="page">

            <section class="card">

                ${progress(
                    2,
                    "কোথায় যাব?"
                )}

                <div class="eyebrow">
                    এবার location
                </div>

                <h2>
                    কোথায় দেখা হবে? 📍
                </h2>

                <p>

function summaryItem(icon,label,value){

    return `

        <div class="summary-item">

            <div class="summary-icon">
                ${icon}

            </small>

/* =========================================================
   LOCATION TEXT
========================================================= */

function locationText(){

    if(plan.customLocation)
        return plan.customLocation;

    return plan.location;
}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(value){

    if(!value)
        return "—";

    const parts =
        value.split("-");

    const date =
        new Date(
            Number(parts[0]),
            Number(parts[1])-1,
            Number(parts[2])
        );

    return date.toLocaleDateString(
        "bn-BD",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );
}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(value){

    if(!value)
        return "—";

    const [hours,minutes] =
        value.split(":");

    let h =
        Number(hours);

    const suffix =
        h >= 12
        ? "PM"
        : "AM";

    h =
        h % 12 || 12;

    return `${h}:${minutes} ${suffix}`;
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return value
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   PREPARE PRINT PAGE
========================================================= */

function preparePrint(){

    document.getElementById("printDate").textContent =
        formatDate(plan.date);

    document.getElementById("printTime").textContent =
        formatTime(plan.time);

    document.getElementById("printLocation").textContent =
        locationText();

    document.getElementById("printFood").textContent =
        plan.food.join(" • ");

    document.getElementById("printDress").textContent =
        plan.dress;

    document.getElementById("printActivities").textContent =
        plan.activities.join(" • ");


    const noteBox =
        document.getElementById("printNoteBox");

    if(plan.note){

        noteBox.style.display="block";

        document.getElementById("printNote").textContent =
            plan.note;

    }else{

        noteBox.style.display="none";

    }
}


/* =========================================================
   PDF / PRINT
========================================================= */

function makePDF(){

    preparePrint();

    /*
       Browser print gives us proper Bengali font
       rendering and a polished A4 layout.
    */

    setTimeout(()=>{

        window.print();

    },100);

}
